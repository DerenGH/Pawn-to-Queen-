/* App core: storage, sound, engine workers, router. */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const store = (() => {
  const mem = {};
  return {
    get(k, d) { try { const v = localStorage.getItem('ptq:' + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem('ptq:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };
})();

const Sound = {
  on: store.get('sound', true), ctx: null,
  toggle() { this.on = !this.on; store.set('sound', this.on); return this.on; },
  play(k) {
    if (!this.on) return;
    try {
      const C = this.ctx || (this.ctx = new (window.AudioContext || window.webkitAudioContext)());
      if (C.state === 'suspended') C.resume();
      const t = C.currentTime, o = C.createOscillator(), g = C.createGain();
      const f = { move: [240, 90], cap: [170, 55], check: [520, 380], end: [330, 200], ok: [620, 880], bad: [200, 140] }[k] || [240, 90];
      o.type = k === 'ok' || k === 'check' ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(f[0], t);
      o.frequency.exponentialRampToValueAtTime(f[1], t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(k === 'cap' ? 0.35 : 0.2, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(C.destination);
      o.start(t); o.stop(t + 0.17);
    } catch (e) { /* audio unavailable */ }
  },
};

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* Two background workers keep the page responsive while the engine thinks. */
const Engine = (() => {
  const tail = ';onmessage=function(e){var d=e.data,r;try{r=d.type==="think"?Search.think(d.fen,d.elo):Search.analyze(d.fen,d.depth,d.ms)}catch(x){r={error:String(x)}}postMessage({id:d.id,r:r})};';
  let workers = [], queue = [], seq = 0;
  const pending = new Map();
  const runSync = (type, p) => { try { return type === 'think' ? Search.think(p.fen, p.elo) : Search.analyze(p.fen, p.depth, p.ms); } catch (e) { return null; } };
  function pump() {
    for (const w of workers) {
      if (w.busy || !queue.length) continue;
      const job = queue.shift();
      w.busy = true; pending.set(job.id, { job, w });
      w.postMessage(Object.assign({ id: job.id, type: job.type }, job.payload));
    }
  }
  function failAll() {
    workers = [];
    for (const [, p] of pending) p.job.res(runSync(p.job.type, p.job.payload));
    pending.clear();
    for (const j of queue.splice(0)) j.res(runSync(j.type, j.payload));
  }
  try {
    const src = $('#engine-src').textContent;
    const url = URL.createObjectURL(new Blob([src + tail], { type: 'text/javascript' }));
    for (let i = 0; i < 2; i++) {
      const w = new Worker(url);
      w.busy = false;
      w.onmessage = (ev) => {
        const p = pending.get(ev.data.id);
        if (!p) return;
        pending.delete(ev.data.id);
        w.busy = false;
        p.job.res(ev.data.r && !ev.data.r.error ? ev.data.r : null);
        pump();
      };
      w.onerror = failAll;
      workers.push(w);
    }
  } catch (e) { workers = []; }
  return {
    call(type, payload) {
      return new Promise((res) => {
        if (!workers.length) { setTimeout(() => res(runSync(type, payload)), 20); return; }
        queue.push({ id: ++seq, type, payload, res });
        pump();
      });
    },
    think: (fen, elo) => Engine.call('think', { fen, elo }),
    analyze: (fen, depth, ms) => Engine.call('analyze', { fen, depth, ms }),
  };
})();

/* Tiny router on the URL hash: #learn, #lesson-<module>-<lesson>, #play, #free */
const App = {
  cleanup: null,
  mount(node, cleanup) {
    if (this.cleanup) { try { this.cleanup(); } catch (e) { /* ignore */ } }
    this.cleanup = cleanup || null;
    const main = $('#view');
    main.replaceChildren(node);
    window.scrollTo(0, 0);
  },
  route() {
    const h = (location.hash || '#learn').slice(1);
    let nav = 'learn';
    if (h.startsWith('lesson-')) {
      const [, mod, les] = h.split('-');
      Learn.lesson(mod, les);
    } else if (h === 'play' || h === 'free') { nav = h; Play.open(h); }
    else Learn.home();
    $$('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === nav));
  },
  go(h) { if (location.hash === h) this.route(); else location.hash = h; },
};

function initTheme() {
  const apply = (v) => { if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); };
  apply(store.get('theme', null));
  $('#theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    store.set('theme', next); apply(next);
  });
  const sb = $('#sound-btn');
  const sync = () => { sb.setAttribute('aria-pressed', String(Sound.on)); sb.querySelector('span').textContent = Sound.on ? 'Sound on' : 'Sound off'; };
  sb.addEventListener('click', () => { Sound.toggle(); sync(); Sound.play('ok'); });
  sync();
}

        </aside>

    let idx = 0, maxIdx = 0, token = 0, curFen = null, stepDone = false, timers = [];
    App.mount(root, () => { token++; timers.forEach(clearTimeout); });
    const board = new Board($('#lb', root), { orientation: 'w' });
    const pb = $('#pb', root), nextBtn = $('#next', root), backBtn = $('#back', root), tray = $('#tray', root);

    const say = (html, kind) => { const fb = $('#fb', pb); if (!fb) return; fb.className = 'fb ' + (kind || 'info'); fb.innerHTML = html; };
    const later = (fn, ms) => { const my = token; timers.push(setTimeout(() => { if (my === token) fn(); }, ms)); };
    const shake = () => { board.root.classList.remove('shake'); void board.root.offsetWidth; board.root.classList.add('shake'); };
    const sqn = Chess.sqNum;

    function setNext() {
      const last = idx === steps.length - 1;
      nextBtn.textContent = last ? 'Finish lesson' : stepDone ? 'Continue' : 'Skip';
      nextBtn.className = 'btn' + (stepDone ? ' pulse' : ' ghost');
      backBtn.disabled = idx === 0;
    }
    function markDone() { stepDone = true; setNext(); $$('#extra .btn', pb).forEach((b) => { b.hidden = true; }); }
    function dots() {
      const d = $('#dots', root); d.innerHTML = '';
      steps.forEach((_, i) => { const b = $el('button', 'dot' + (i === idx ? ' on' : i <= maxIdx ? ' seen' : '')); b.setAttribute('aria-label', 'Step ' + (i + 1)); b.disabled = i > maxIdx; b.addEventListener('click', () => { idx = i; render(); }); d.append(b); });
    }

    function addHint(fn, label) {
      const ex = $('#extra', pb);
      const b = $el('button', 'btn ghost sm', label || 'Hint');
      b.addEventListener('click', () => fn(b));
      ex.append(b);
      return b;
    }

    function render() {
      token++; timers.forEach(clearTimeout); timers = [];
      const s = steps[idx];
      maxIdx = Math.max(maxIdx, idx);
      stepDone = false;
      curFen = s.fen || curFen || Chess.START;
      board.setMode('none'); board.clearAnnotations(); board.setCheck(-1); board.setLast(null);
      const wantFlip = s.as === 'b';
      if (board.flipped !== wantFlip) board.flip(wantFlip);
      board.setFen(curFen);
      board.setHl((s.hl || []).map(sqn));
      board.setArrows((s.arrows || []).map((a) => [a[0], a[1], a[2] || 'g']));
      board.o = {};
      tray.hidden = true; tray.innerHTML = '';
      $('#ps', root).textContent = les.title + ' · Step ' + (idx + 1) + ' of ' + steps.length;
      let body = s.body;
      if (!body && s.t === 'move') body = s.mate ? 'Find the checkmate in one move. Tap a piece, then its square, or drag it.' : 'Your turn. Tap a piece, then its destination, or drag it.';
      pb.innerHTML = `<h2>${esc(s.title)}</h2><div class="body">${fmt(body)}</div><div class="fb" id="fb" aria-live="polite"></div><div class="extra" id="extra"></div>`;
      pb.scrollTop = 0;
      const handler = { text: tText, explore: tExplore, move: tMove, tap: tTap, quiz: tQuiz, place: tPlace, line: tLine }[s.t] || tText;
      handler(s);
      dots(); setNext();
    }

    function tText() { markDone(); }

    function tExplore(s) {
      let pos = new Chess.Position(curFen);
      const turn = pos.turn; let count = 0;
      const prog = $el('p', 'prog', 'Moves made: 0 of ' + s.need);
      $('#extra', pb).append(prog);
      board.o = {
        getMoves: (f) => pos.movesFrom(f).filter((m) => (pos.b[Chess.mTo(m)] & 7) !== 6),
        canMoveFrom: (sq) => pos.b[sq] && (pos.b[sq] >> 3) === turn,
        isEp: (q) => q === pos.ep,
        onMove: (m) => {
          Sound.play(m >> 17 & Chess.CAP ? 'cap' : 'move');
          board.movePiece(m); pos.make(m);
          const p = pos.fen().split(' '); p[1] = turn ? 'b' : 'w'; p[3] = '-';
          pos = new Chess.Position(p.join(' '));
          count++; prog.textContent = 'Moves made: ' + Math.min(count, s.need) + ' of ' + s.need;
          if (count >= s.need && !stepDone) { say('Nice. You have the idea.', 'ok'); markDone(); }
        },
      };
      board.setMode('move');
    }

    function tMove(s) {
      const pos = new Chess.Position(curFen);
      let attempts = 0, hints = 0;
      const answerMove = () => { if (s.mate) { for (const m of pos.legal()) { pos.make(m); const ok = pos.inCheck() && !pos.legal().length; pos.unmake(); if (ok) return m; } } return pos.parse(s.ok[0]); };
      board.o = {
        getMoves: (f) => pos.movesFrom(f),
        canMoveFrom: (sq) => pos.b[sq] && (pos.b[sq] >> 3) === pos.turn,
        isEp: (q) => q === pos.ep,
        onMove: (m) => {
          let good;
          if (s.mate) { pos.make(m); good = pos.inCheck() && pos.legal().length === 0; pos.unmake(); } else good = s.ok.includes(Chess.uci(m));
          if (good) {
            board.setMode('none'); board.setArrows([]);
            Sound.play(m >> 17 & Chess.CAP ? 'cap' : 'move');
            board.movePiece(m); pos.make(m); board.setCheck(pos.inCheck() ? pos.kp[pos.turn] : -1);
            say(s.win || 'Correct!', 'ok'); markDone();
          } else {
            attempts++; Sound.play('bad'); shake();
            say(s.wrong || (s.mate ? 'That is not checkmate. Look for a check where the king has no escape.' : 'Not quite. Try again.'), 'bad');
            if (attempts >= 3 && hints === 0) hintBtn.click();
          }
        },
      };
      board.setMode('move');
      const hintBtn = addHint(() => {
        hints++;
        if (hints === 1 && s.hint) say('<b>Hint:</b> ' + s.hint, 'info');
        else { const m = answerMove(); board.setArrows([[Chess.mFrom(m), Chess.mTo(m), 'g']]); if (!s.hint || hints > 1) say('Follow the arrow.', 'info'); }
      });
    }

    function tTap(s) {
      const found = new Set(); let attempts = 0, marks = {};
      board.o = {
        onTap: (sq) => {
          if (stepDone) return;
          const n = Chess.sqName(sq);
          if (s.answers.includes(n)) {
            if (found.has(n)) return;
            found.add(n); marks[sq] = 'ok'; board.setMarks(Object.assign({}, marks)); Sound.play('ok');
            if (!s.all || found.size === s.answers.length) { say('Correct!', 'ok'); board.setMode('none'); markDone(); }
            else say('Good. ' + (s.answers.length - found.size) + ' to go.', 'info');
          } else {
            attempts++; Sound.play('bad');
            const keep = Object.assign({}, marks); keep[sq] = 'bad'; board.setMarks(keep);
            later(() => board.setMarks(Object.assign({}, marks)), 600);
            say('Not that square. Look again.', 'bad');
            if (attempts >= 3) reveal();
          }
        },
      };
      board.setMode('tap');
      const reveal = () => board.setHl(s.answers.filter((a) => !found.has(a)).map(sqn));
      addHint(() => { reveal(); say('The highlighted square' + (s.answers.length > 1 ? 's are' : ' is') + ' what we want.', 'info'); });
    }

    function tQuiz(s) {
      const ex = $('#extra', pb);
      const list = $el('div', 'opts');
      let wrong = 0;
      s.options.forEach((o, i) => {
        const b = $el('button', 'opt', '<span class="mk"></span><span>' + esc(o) + '</span>');
        b.addEventListener('click', () => {
          if (stepDone) return;
          if (i === s.answer) {
            b.classList.add('ok'); $$('.opt', list).forEach((x) => { x.disabled = true; });
            say('<b>Correct.</b> ' + s.why, 'ok'); Sound.play('ok'); markDone();
          } else {
            b.classList.add('bad'); b.disabled = true; wrong++; Sound.play('bad');
            say('Not quite. Try another answer.' + (wrong >= 2 ? ' Think about what the position shows.' : ''), 'bad');
          }
        });
        list.append(b);
      });
      ex.append(list);
    }

    function tPlace(s) {
      const letters = [...new Set(Object.values(s.targets))];
      const placed = {}; let sel = letters[0], attempts = 0;
      tray.hidden = false;
      const left = (L) => Object.entries(s.targets).filter(([q, l]) => l === L && !placed[q]).length;
      const code = (L) => (L === L.toUpperCase() ? 'w' : 'b') + L.toUpperCase();
      const drawTray = () => {
        tray.innerHTML = '';
        letters.forEach((L) => {
          const b = $el('button', 'tp' + (L === sel ? ' on' : '') + (left(L) ? '' : ' fin'), `<span class="pc-${code(L)}"></span><em>${left(L)}</em>`);
          b.setAttribute('aria-label', PNAME[L.toLowerCase()] + ', ' + left(L) + ' left');
          b.addEventListener('click', () => { if (left(L)) { sel = L; drawTray(); } });
          tray.append(b);
        });
      };
      drawTray();
      board.o = {
        onTap: (sq) => {
          if (stepDone) return;
          const n = Chess.sqName(sq), L = s.targets[n];
          if (placed[n]) return;
          if (L && L === sel) {
            placed[n] = 1; board.mkPiece(code(L), sq); Sound.play('move');
            if (!left(sel)) sel = letters.find((x) => left(x)) || sel;
            drawTray(); board.setHl([]);
            if (letters.every((x) => !left(x))) { say('All placed. Well done.', 'ok'); board.setMode('none'); markDone(); }
            else say(Object.keys(placed).length + ' of ' + Object.keys(s.targets).length + ' placed.', 'info');
          } else {
            attempts++; Sound.play('bad'); shake();
            say(L ? 'That square is for the ' + PNAME[L.toLowerCase()] + '. Pick it in the tray first.' : 'Not there. Try another square.', 'bad');
            if (attempts >= 2) revealHint();
          }
        },
      };
      board.setMode('tap');
      const revealHint = () => board.setHl(Object.entries(s.targets).filter(([q, l]) => l === sel && !placed[q]).map(([q]) => sqn(q)));
      addHint(() => { revealHint(); say('Highlighted: where the selected piece goes.', 'info'); });
    }

    function tLine(s) {
      const game = new Chess.Game(curFen);
      const as = s.as === 'b' ? 1 : 0;
      let i = 0, attempts = 0, hints = 0, busy = false;
      const log = $el('ol', 'notes');
      $('#extra', pb).append(log);
      const addNote = (label, note) => { const li = $el('li', '', '<b>' + esc(label) + '</b> ' + (note || '')); log.append(li); li.scrollIntoView({ block: 'nearest' }); };
      function play(m) {
        const full = game.pos.full, white = game.pos.turn === 0;
        const san = game.play(m);
        Sound.play(m >> 17 & Chess.CAP ? 'cap' : 'move');
        board.movePiece(m); board.setArrows([]);
        board.setCheck(game.pos.inCheck() ? game.pos.kp[game.pos.turn] : -1);
        addNote(full + (white ? '.' : '...') + ' ' + san, s.notes && s.notes[i]);
        i++;
        advance();
      }
      function advance() {
        if (i >= s.line.length) {
          board.setMode('none'); busy = true;
          say('Line complete. Well played.', 'ok'); markDone();
          const again = addHint(() => render(), 'Play it again');
          return;
        }
        if (game.pos.turn !== as) {
          busy = true; board.setMode('none');
          later(() => { busy = false; play(game.pos.parse(s.line[i])); }, 700);
        } else { busy = false; board.setMode('move'); }
      }
      board.o = {
        getMoves: (f) => game.pos.movesFrom(f),
        canMoveFrom: (sq) => !busy && game.pos.b[sq] && (game.pos.b[sq] >> 3) === as && game.pos.turn === as,
        isEp: (q) => q === game.pos.ep,
        onMove: (m) => {
          if (Chess.uci(m) === s.line[i]) { attempts = 0; say('', 'info'); play(m); }
          else { attempts++; Sound.play('bad'); shake(); say('That is a legal move, but not the one from this line. Try again.', 'bad'); if (attempts >= 3) hintBtn.click(); }
        },
      };
      const hintBtn = addHint(() => {
        hints++;
        const m = game.pos.parse(s.line[i]);
        if (hints === 1 && s.hint) say('<b>Hint:</b> ' + s.hint, 'info');
        else if (hints <= 2) { board.setArrows([[Chess.mFrom(m), Chess.mTo(m), 'g']]); say('Follow the arrow.', 'info'); }
        else { say('', 'info'); play(m); hints = 0; }
      });
      advance();
    }

    function finish() {
      Progress.mark(mod.id, les.id);
      token++; timers.forEach(clearTimeout);
      board.setMode('none'); tray.hidden = true;
      let nx = null, found = false;
      for (const m of COURSE.modules) for (const l of m.lessons) { if (found && !nx) nx = [m, l]; if (m.id === mod.id && l.id === les.id) found = true; }
      $('#ps', root).textContent = les.title;
      pb.innerHTML = `<div class="complete"><div class="chk">✓</div><h2>Lesson complete</h2><p>${esc(les.title)} is done. ${nx ? 'Up next: <b>' + esc(nx[1].title) + '</b>.' : 'That is the whole course. Time to play.'}</p>
        <div class="cbtns">${nx ? `<a class="btn big" href="${lessonHref(nx[0], nx[1])}">Next lesson</a>` : '<a class="btn big" href="#play">Play the coach</a>'}
        ${les.practice ? '<button class="btn big ghost" id="prac">Practice with the coach</button>' : ''}
        <a class="btn ghost" href="#learn">Back to the course</a></div></div>`;
      const pr = $('#prac', pb);
      if (pr) pr.addEventListener('click', () => Play.fromLesson(les.practice));
      Sound.play('ok');
      $('.pf', root).hidden = true;
    }

    nextBtn.addEventListener('click', () => { if (idx < steps.length - 1) { idx++; render(); } else finish(); });
    backBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
    render();
  },
};

/* Play: setup screen and game screen with the live coach. */
const fenFromMoves = (ucis, start) => { const g = new Chess.Game(start || Chess.START); for (const u of ucis) { const m = g.pos.parse(u); if (!m) break; g.play(m); } return g.pos.fen(); };

const PRESETS = [
  { label: 'Standard starting position', fen: Chess.START },
  { label: 'King and queen vs king: deliver mate', fen: '7k/8/8/8/8/8/8/K2Q4 w - - 0 1' },
  { label: 'King and rook vs king: deliver mate', fen: '7k/8/8/8/8/8/8/K2R4 w - - 0 1' },
  { label: 'Two rooks vs king: ladder mate', fen: '7k/8/8/8/8/8/8/R3K2R w - - 0 1' },
  { label: 'King and pawn vs king: opposition', fen: '8/8/8/4k3/8/4K3/4P3/8 w - - 0 1' },
  { label: 'Back-rank mate chance', fen: '6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1' },
  { label: 'Two Knights Defense: try Ng5', fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4' },
  { label: 'Open Sicilian after 5 moves', fen: fenFromMoves(['e2e4', 'c7c5', 'g1f3', 'd7d6', 'd2d4', 'c5d4', 'f3d4', 'g8f6', 'b1c3', 'a7a6']) },
];

function coursePresets() {
  const out = [];
  for (const m of COURSE.modules) for (const l of m.lessons) {
    if (!l.practice) continue;
    const p = l.practice;
    out.push({ label: m.title + ': ' + p.label, fen: p.fen || fenFromMoves(p.moves || []) });
  }
  return out;
}

function validFen(fen) {
  try {
    const parts = fen.trim().split(/\s+/);
    if (parts.length < 2) return 'A FEN needs at least the piece placement and the side to move.';
    const rows = parts[0].split('/');
    if (rows.length !== 8) return 'The piece placement must have 8 ranks separated by "/".';
    for (const r of rows) { let n = 0; for (const ch of r) n += /[1-8]/.test(ch) ? +ch : /[pnbrqkPNBRQK]/.test(ch) ? 1 : 99; if (n !== 8) return 'Every rank must add up to 8 squares.'; }
    const p = new Chess.Position(fen);
    let wk = 0, bk = 0;
    for (let s = 0; s < 120; s++) {
      if (s & 0x88) { s += 7; continue; }
      const x = p.b[s];
      if (x === 6) wk++; if (x === 14) bk++;
      if ((x & 7) === 1 && ((s >> 4) === 0 || (s >> 4) === 7)) return 'Pawns cannot stand on the first or last rank.';
    }
    if (wk !== 1 || bk !== 1) return 'Each side needs exactly one king.';
    if (p.attacked(p.kp[p.turn ^ 1], p.turn)) return 'The side that is not to move cannot be in check.';
    return null;
  } catch (e) { return 'That does not look like a valid FEN.'; }
}

function eloInfo(e) {
  if (e < 600) return ['Just learning', 'Knows how pieces move. Hangs pieces often.'];
  if (e < 1000) return ['Beginner', 'Knows the basics but misses most tactics.'];
  if (e < 1400) return ['Casual player', 'Plays sensible moves and falls for simple tricks.'];
  if (e < 1800) return ['Club player', 'Solid. Rarely gives away a piece for free.'];
  if (e < 2200) return ['Advanced', 'Sees tactics several moves deep.'];
  return ['Expert', 'The strongest this in-browser coach can play.'];
}

function boardToFen(b, turn) {
  const rows = [];
  for (let r = 7; r >= 0; r--) {
    let s = '', e = 0;
    for (let f = 0; f < 8; f++) {
      const c = b.codeAt(r * 16 + f);
      if (!c) { e++; continue; }
      if (e) { s += e; e = 0; }
      s += c[0] === 'w' ? c[1] : c[1].toLowerCase();
    }
    if (e) s += e;
    rows.push(s);
  }
  const has = (sq, c) => b.codeAt(Chess.sqNum(sq)) === c;
  let cs = '';
  if (has('e1', 'wK')) { if (has('h1', 'wR')) cs += 'K'; if (has('a1', 'wR')) cs += 'Q'; }
  if (has('e8', 'bK')) { if (has('h8', 'bR')) cs += 'k'; if (has('a8', 'bR')) cs += 'q'; }
  return rows.join('/') + ' ' + (turn ? 'b' : 'w') + ' ' + (cs || '-') + ' - 0 1';
}

const Play = {

          <p class="fine">Ratings are approximate. Lower levels search less deeply and make human-style slips.</p></div>
        <div class="field"><label>Coach explanations</label>
          <label class="sw"><input type="checkbox" id="x-bot" ${saved.xbot ? 'checked' : ''} ${saved.mode === 'free' ? 'disabled' : ''}><span></span>Explain the coach's moves</label>
          <label class="sw"><input type="checkbox" id="x-me" ${saved.xme ? 'checked' : ''}><span></span>${saved.mode === 'free' ? 'Explain every move' : 'Explain my moves'}</label></div>
        <div class="field"><label for="pos">Starting position</label>

          <div class="row"><button class="btn ghost sm" id="edit">Edit on the board</button><button class="btn ghost sm" id="fenb">FEN</button></div>

    function setPos(f) { customFen = f; board.setFen(f); board.clearAnnotations(); board.flip(saved.side === 'b'); }

    function wire() {
      $$('#mode button', sp).forEach((b) => b.addEventListener('click', () => { saved.mode = b.dataset.v; drawSetup(); }));
      $$('#side button', sp).forEach((b) => b.addEventListener('click', () => { saved.side = b.dataset.v; $$('#side button', sp).forEach((x) => x.classList.toggle('on', x === b)); board.flip(saved.side === 'b'); }));
      const elo = $('#elo', sp);
      elo.addEventListener('input', () => { saved.elo = +elo.value; const [n, d] = eloInfo(saved.elo); $('#elo-v', sp).textContent = saved.elo; $('#elo-n', sp).textContent = n; $('#elo-t', sp).textContent = d; });

      $('#fen', sp).addEventListener('input', (e) => {
        const v = e.target.value.trim(), err = validFen(v), msg = $('#fenmsg', sp);
        if (err) msg.textContent = err; else { msg.textContent = 'Position loaded.'; customFen = v; presetIdx = 'custom'; $('#pos', sp).value = 'custom'; setPos(v); }
      });
      $('#edit', sp).addEventListener('click', startEdit);
      $('#go', sp).addEventListener('click', () => {
        const err = validFen(customFen);
        if (err) { toast(err); $('#fenbox', sp).hidden = false; $('#fenmsg', sp).textContent = err; return; }
        store.set('play', { mode: saved.mode, side: saved.side, elo: saved.elo, xbot: saved.xbot, xme: saved.xme });
        const color = saved.side === 'r' ? (Math.random() < 0.5 ? 0 : 1) : saved.side === 'b' ? 1 : 0;
        Play.game({ fen: customFen, mode: saved.mode, color, elo: saved.elo, xbot: saved.xbot, xme: saved.xme });
      });
    }

    function startEdit() {
      editing = true; editTurn = +(customFen.split(' ')[1] === 'b');
      etray.hidden = false; board.setMode('tap'); board.flip(false);
      const codes = ['wK', 'wQ', 'wR', 'wB', 'wN', 'wP', 'bK', 'bQ', 'bR', 'bB', 'bN', 'bP'];
      const drawT = () => {
        etray.innerHTML = '';
        codes.forEach((c) => { const b = $el('button', 'tp' + (c === editSel ? ' on' : ''), `<span class="pc-${c}"></span>`); b.setAttribute('aria-label', (c[0] === 'w' ? 'White ' : 'Black ') + PNAME[c[1].toLowerCase()]); b.addEventListener('click', () => { editSel = c; drawT(); }); etray.append(b); });
        const er = $el('button', 'tp era' + (editSel === 'x' ? ' on' : ''), '<em>Erase</em>'); er.addEventListener('click', () => { editSel = 'x'; drawT(); }); etray.append(er);
      };
      drawT();
      board.o = { onTap: (sq) => {
        const cur = board.pieces.get(sq);
        if (cur) { cur.el.remove(); board.pieces.delete(sq); }
        if (editSel !== 'x' && !(cur && cur.code === editSel)) board.mkPiece(editSel, sq);
      } };
      sp.innerHTML = `<h1>Edit position</h1><p class="hint">Pick a piece below the board, then tap squares to place it. Tap a piece again to remove it.</p>
        <div class="field"><label>Side to move</label><div class="seg" id="turn"><button data-v="0" class="${editTurn ? '' : 'on'}">White</button><button data-v="1" class="${editTurn ? 'on' : ''}">Black</button></div></div>
        <div class="row"><button class="btn ghost sm" id="clr">Clear board</button><button class="btn ghost sm" id="std">Standard setup</button></div>
        <p class="fine" id="emsg"></p><button class="btn big go" id="done">Use this position</button>`;
      $$('#turn button', sp).forEach((b) => b.addEventListener('click', () => { editTurn = +b.dataset.v; $$('#turn button', sp).forEach((x) => x.classList.toggle('on', x === b)); }));
      $('#clr', sp).addEventListener('click', () => board.setFen('8/8/8/8/8/8/8/8 w - - 0 1'));
      $('#std', sp).addEventListener('click', () => board.setFen(Chess.START));
      $('#done', sp).addEventListener('click', () => {
        const f = boardToFen(board, editTurn), err = validFen(f);
        if (err) { $('#emsg', sp).textContent = err; return; }
        editing = false; etray.hidden = true; board.setMode('none'); board.o = {};
        customFen = f; presetIdx = 'custom'; drawSetup(); setPos(f);
      });
    }

    drawSetup();
    setPos(customFen);
    board.flip(saved.side === 'b');
  },

  game(cfg) {
    const root = $el('div', 'play-page');
    root.innerHTML = `
      <div class="lesson game">
        <div class="bcol">
          <div class="pbar" id="pt"></div>
          <div class="board-box"><div id="gb"></div><div class="overlay" id="ov" hidden></div></div>
          <div class="pbar" id="pm"></div>
        </div>
        <aside class="panel card gpanel"><div class="pin">
          <header class="ph"><span class="av pc-wN"></span><div><b>Coach Knightly</b><small id="cs"></small></div><span class="spin" id="spin" hidden></span></header>
          <div class="opening" id="op" hidden></div>
          <div class="feed" id="feed" aria-live="polite"></div>
          <div class="movebox"><div class="mnav"><button id="m0" aria-label="First move">⏮</button><button id="m1" aria-label="Previous move">◀</button><button id="m2" aria-label="Next move">▶</button><button id="m3" aria-label="Latest move">⏭</button></div><div class="moves" id="moves"></div></div>
          <div class="gact"><button class="btn ghost sm" id="a-hint">Hint</button><button class="btn ghost sm" id="a-an">Analyze</button><button class="btn ghost sm" id="a-undo">Take back</button><button class="btn ghost sm" id="a-flip">Flip</button>${cfg.mode === 'coach' ? '<button class="btn ghost sm" id="a-draw">Offer draw</button>' : ''}<button class="btn ghost sm" id="a-res">${cfg.mode === 'coach' ? 'Resign' : 'New game'}</button></div>
        </div></aside>
      </div>`;
    let token = 0, thinking = false, over = false, viewK = null, resignArm = 0;
    const key = (e) => { if (/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return; if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); } else if (e.key === 'ArrowRight') { go(1); e.preventDefault(); } };
    document.addEventListener('keydown', key);
    App.mount(root, () => { token++; document.removeEventListener('keydown', key); });

    const game = new Chess.Game(cfg.fen);
    const startTurn = game.pos.turn, startFull = game.pos.full;
    const board = new Board($('#gb', root), { orientation: cfg.mode === 'coach' && cfg.color === 1 ? 'b' : 'w' });
    board.setFen(cfg.fen);
    const feed = $('#feed', root), ov = $('#ov', root), cs = $('#cs', root), spin = $('#spin', root);
    const sqNum = Chess.sqNum;
    const cname = (c) => (c ? 'Black' : 'White');
    const isBotTurn = () => cfg.mode === 'coach' && game.pos.turn !== cfg.color;
    const live = () => viewK === null;
    const fenAt = (k) => (k === 0 ? game.startFen : k < game.hist.length ? game.hist[k].fenBefore : game.pos.fen());

    function bubble(html, cls) { const d = $el('div', 'msg ' + (cls || ''), html); feed.append(d); feed.scrollTop = feed.scrollHeight; return d; }
    const sysSay = (t) => bubble(t, 'sys');
    const coachSay = (html) => bubble('<span class="av sm pc-wN"></span><div class="mb">' + html + '</div>', 'coach');

    function bar(el, color) {
      const f = game.pos.fen(), mat = Coach.material(f), cap = Coach.captured(f);
      const mine = color === 0 ? cap.b : cap.w; // pieces this side has captured
      const lead = color === 0 ? mat.diff : -mat.diff;
      const coachSide = cfg.mode === 'coach' && color !== cfg.color;
      const nm = cfg.mode === 'coach' ? (coachSide ? 'Coach Knightly' : 'You') : cname(color);
      const sub = coachSide ? '<span class="elo">' + cfg.elo + '</span>' : '';
      const av = coachSide ? '<span class="av sm pc-wN"></span>' : '<span class="av sm you pc-' + (color ? 'bK' : 'wK') + '"></span>';
      const victim = color ? 'w' : 'b';
      const caps = mine.map((t) => '<i class="pc-' + victim + 'PNBRQK'.charAt(t - 1) + '"></i>').join('');
      el.innerHTML = av + '<b>' + nm + '</b>' + sub + '<span class="caps">' + caps + '</span><span class="lead">' + (lead > 0 ? '+' + lead : '') + '</span>';
    }

    function renderBars() {
      const bottom = board.flipped ? 1 : 0;
      bar($('#pm', root), bottom); bar($('#pt', root), bottom ^ 1);
      $('#pm', root).classList.toggle('turn', !over && live() && game.pos.turn === bottom);
      $('#pt', root).classList.toggle('turn', !over && live() && game.pos.turn !== bottom);
    }

    function renderMoves() {
      const box = $('#moves', root); box.innerHTML = '';
      const n = game.hist.length; let row = null;
      for (let j = 0; j < n; j++) {
        const c = (startTurn + j) % 2, num = startFull + Math.floor((startTurn + j) / 2);
        if (c === 0 || j === 0) { row = $el('div', 'mrow', '<span class="mn">' + num + '.</span>'); if (c === 1) row.append($el('span', 'mv empty', '…')); box.append(row); }
        const b = $el('button', 'mv' + ((viewK === null ? n : viewK) === j + 1 ? ' on' : ''), esc(game.hist[j].san));
        b.addEventListener('click', () => showPly(j + 1));
        row.append(b);
      }
      box.scrollTop = box.scrollHeight;
      const k = viewK === null ? n : viewK;
      $('#m0', root).disabled = $('#m1', root).disabled = k === 0;
      $('#m2', root).disabled = $('#m3', root).disabled = k === n;
      const op = $('#op', root);
      if (game.startFen === Chess.START) { const o = Coach.openingFor(game.hist.map((h) => h.uci)); op.hidden = !(o.name && n > 0); op.innerHTML = o.name ? '<span>Opening</span> <b>' + esc(o.name) + '</b>' : ''; } else op.hidden = true;
    }

    function status() {
      cs.textContent = over ? 'Game over' : thinking ? 'Thinking…' : cfg.mode === 'coach' ? (isBotTurn() ? 'Coach to move' : 'Your move') : cname(game.pos.turn) + ' to move';
      spin.hidden = !thinking;
    }

    function interactive() {
      if (over || !live() || thinking) { board.setMode('none'); return; }
      board.setMode(cfg.mode === 'free' || !isBotTurn() ? 'move' : 'none');
    }

    function paintLast() {
      const h = game.hist[(viewK === null ? game.hist.length : viewK) - 1];
      if (h) { board.setLast(sqNum(h.uci.slice(0, 2)), sqNum(h.uci.slice(2, 4))); } else board.setLast(null);
      const p = viewK === null ? game.pos : new Chess.Position(fenAt(viewK));
      board.setCheck(p.inCheck() ? p.kp[p.turn] : -1);
    }

    function refresh() { renderBars(); renderMoves(); status(); interactive(); paintLast(); }

    function showPly(k) {
      const n = game.hist.length;
      board.setArrows([]);
      viewK = k >= n ? null : Math.max(0, k);
      board.setFen(fenAt(k >= n ? n : Math.max(0, k)));
      refresh();
    }
    function go(d) { const n = game.hist.length, k = (viewK === null ? n : viewK) + d; if (k >= 0 && k <= n) showPly(k); }
    $('#m0', root).addEventListener('click', () => showPly(0));
    $('#m1', root).addEventListener('click', () => go(-1));
    $('#m2', root).addEventListener('click', () => go(1));
    $('#m3', root).addEventListener('click', () => showPly(game.hist.length));

    board.o = {
      getMoves: (f) => game.pos.movesFrom(f),
      canMoveFrom: (sq) => !over && live() && !thinking && game.pos.b[sq] && (game.pos.b[sq] >> 3) === game.pos.turn && (cfg.mode === 'free' || game.pos.turn === cfg.color),
      isEp: (q) => q === game.pos.ep,
      onMove: (m) => userMove(m),
    };

    function apply(m, quiet) {
      const san = game.play(m);
      board.setArrows([]);
      board.movePiece(m);
      const st = game.status();
      Sound.play(st.over ? 'end' : game.pos.inCheck() ? 'check' : m >> 17 & Chess.CAP ? 'cap' : 'move');
      return { san, st };
    }

    async function userMove(m) {
      const my = ++token;
      const fenBefore = game.pos.fen(), uci = Chess.uci(m), mover = game.pos.turn;
      const { san, st } = apply(m);
      const fenAfter = game.pos.fen();
      refresh();
      const wantBot = cfg.mode === 'coach' && !st.over;
      if (wantBot) { thinking = true; status(); interactive(); }
      const botP = wantBot ? Promise.all([Engine.think(fenAfter, cfg.elo), wait(650)]) : null;
      if (cfg.xme) {
        const msg = await explainUser(fenBefore, fenAfter, m, san, uci, mover, st);
        if (my !== token) return;
        if (msg) coachSay(msg);
      }
      if (st.over) { thinking = false; endGame(st); return; }
      if (botP) await botTurn(my, botP);
      else { thinking = false; refresh(); }
    }

    async function explainUser(fenBefore, fenAfter, m, san, uci, mover, st) {
      const d = Coach.describe(fenBefore, m);
      let head = '', tail = '';
      if (st.over && st.reason === 'checkmate') return '<b>' + esc(san) + '</b> ' + d.sentences[0];
      const a = await Engine.analyze(fenBefore, 3, 1200);
      const g = a ? Coach.grade(a.scored, uci) : null;
      const book = game.startFen === Chess.START ? Coach.openingFor(game.hist.map((h) => h.uci)) : { book: false };
      if (g) {
        head = '<span class="grade g-' + g.cls + '">' + g.text + '</span> ';
        if (g.loss >= 45 && g.bestUci !== uci) {
          const pb = new Chess.Position(fenBefore), bm = pb.parse(g.bestUci), bs = pb.san(bm);
          tail = ' A stronger move was <b>' + esc(bs) + '</b>: ' + Coach.describe(fenBefore, bm).sentences[0].replace(/^It /, 'it ');
          if (g.loss >= 120) {
            const r = await Engine.analyze(fenAfter, 3, 800);
            if (r && r.scored.length) {
              const pa = new Chess.Position(fenAfter), rm = pa.parse(r.scored[0].uci);
              if (rm) tail += ' Your move allows <b>' + esc(pa.san(rm)) + '</b>: ' + Coach.describe(fenAfter, rm).sentences[0].replace(/^It /, 'it ');
            }
          }
        }
        if (g.key === 'best' && book.book) tail += ' This is a known opening move.';
      }
      return head + '<b>' + esc(san) + '</b> ' + d.sentences.join(' ') + tail;
    }

    async function botTurn(my, pre) {
      thinking = true; status(); interactive();
      const res = await (pre || Promise.all([Engine.think(game.pos.fen(), cfg.elo), wait(650)]));
      if (my !== token) return;
      const r = res[0];
      thinking = false;
      if (!r) { refresh(); return; }
      const fenBefore = game.pos.fen(), m = game.pos.parse(r.uci);
      const d = cfg.xbot ? Coach.describe(fenBefore, m) : null;
      const { san, st } = apply(m);
      refresh();
      if (d) coachSay('I played <b>' + esc(san) + '</b>. ' + d.sentences.join(' '));
      if (st.over) endGame(st);
    }

    function endGame(st) {
      over = true; thinking = false; refresh();
      const reasons = { checkmate: 'by checkmate', stalemate: 'by stalemate', insufficient: 'by insufficient material', fifty: 'by the 50-move rule', repetition: 'by threefold repetition', resign: 'by resignation', agreed: 'by agreement' };
      let title, sub = reasons[st.reason] || '';
      if (st.winner === null || st.winner === undefined) title = 'Draw';
      else if (cfg.mode === 'coach') title = st.winner === cfg.color ? 'You won' : 'Coach wins';
      else title = cname(st.winner) + ' wins';
      ov.hidden = false;
      ov.innerHTML = `<div class="ov-card"><h2>${title}</h2><p>${sub}</p><div class="cbtns"><button class="btn big" id="o-re">${cfg.mode === 'coach' ? 'Rematch' : 'Play again'}</button><button class="btn ghost" id="o-new">New game</button><button class="btn ghost" id="o-rev">Review game</button></div></div>`;
      $('#o-re', ov).addEventListener('click', () => Play.game(Object.assign({}, cfg, cfg.mode === 'coach' ? { color: cfg.color ^ 1 } : {})));
      $('#o-new', ov).addEventListener('click', () => App.go('#' + (cfg.mode === 'free' ? 'free' : 'play')));
      $('#o-rev', ov).addEventListener('click', () => { ov.hidden = true; showPly(0); });
      const msgs = { checkmate: st.winner === cfg.color && cfg.mode === 'coach' ? 'Checkmate. Well played. Step back through the moves to see where the game turned.' : 'Checkmate. Use the arrows or tap any move to replay the game.', stalemate: 'Stalemate: no legal move, but no check, so the game is drawn. It is worth remembering when you are ahead.', insufficient: 'Neither side has enough material left to checkmate.', fifty: 'Fifty moves with no capture or pawn move is a draw.', repetition: 'The same position came up three times, so it is a draw.', resign: 'Game over.', agreed: 'We agreed to a draw.' };
      sysSay(msgs[st.reason] || 'Game over.');
    }

    async function suggest(analyze) {
      if (over || thinking || !live() || (cfg.mode === 'coach' && isBotTurn())) return;
      const my = token; thinking = true; status(); interactive();
      const fen = game.pos.fen();
      const a = await Engine.analyze(fen, 4, 2200);
      if (my !== token) return;
      thinking = false; refresh();
      if (!a || !a.scored.length) { coachSay('I could not find a move to suggest.'); return; }
      const p = new Chess.Position(fen), bm = p.parse(a.scored[0].uci), bs = p.san(bm), d = Coach.describe(fen, bm);
      board.setArrows([[Chess.mFrom(bm), Chess.mTo(bm), 'g']]);
      let html = '';
      if (analyze) html += Coach.summarize(fen, a.scored[0]).map(esc).join(' ') + ' ';
      html += (analyze ? 'My pick for ' + cname(p.turn) + ': ' : 'Consider ') + '<b>' + esc(bs) + '</b>. ' + d.sentences.slice(0, 2).join(' ');
      coachSay(html);
    }

    function takeBack() {
      if (!game.hist.length) return;
      token++; thinking = false; over = false; ov.hidden = true;
      if (cfg.mode === 'free') game.undo();
      else { let need = game.pos.turn === cfg.color ? 2 : 1; while (need-- > 0 && game.hist.length) game.undo(); }
      viewK = null; board.setArrows([]); board.setFen(game.pos.fen());
      refresh();
      if (isBotTurn()) botTurn(++token);
    }

    $('#a-hint', root).addEventListener('click', () => suggest(false));
    $('#a-an', root).addEventListener('click', () => suggest(true));
    $('#a-undo', root).addEventListener('click', takeBack);
    $('#a-flip', root).addEventListener('click', () => { board.flip(); renderBars(); board.setArrows(board.arrows); });
    const draw = $('#a-draw', root);
    if (draw) draw.addEventListener('click', async () => {
      if (over || thinking || isBotTurn()) return;
      const my = token, a = await Engine.analyze(game.pos.fen(), 3, 900);
      if (my !== token || over) return;
      const mine = a && a.scored.length ? (game.pos.turn === cfg.color ? -a.scored[0].score : a.scored[0].score) : 0;
      if (mine <= 15) { coachSay('I accept the draw offer.'); endGame({ over: true, reason: 'agreed', winner: null }); } else coachSay('I think I am doing better, so I will play on.');
    });
    const res = $('#a-res', root);
    res.addEventListener('click', () => {
      if (cfg.mode === 'free') { App.go('#free'); return; }
      if (over) { App.go('#play'); return; }
      if (!resignArm) { resignArm = 1; res.textContent = 'Tap again to resign'; setTimeout(() => { resignArm = 0; res.textContent = 'Resign'; }, 3000); return; }
      token++; endGame({ over: true, reason: 'resign', winner: cfg.color ^ 1 });
    });

    // Opening message
    const first = cfg.mode === 'coach'
      ? 'Let us play. I am set to about <b>' + cfg.elo + '</b> (' + eloInfo(cfg.elo)[0].toLowerCase() + '). You have the ' + (cfg.color ? 'black' : 'white') + ' pieces.' + (cfg.xme || cfg.xbot ? ' I will explain ' + (cfg.xme && cfg.xbot ? 'both our moves' : cfg.xme ? 'your moves' : 'my moves') + ' as we go.' : '')
      : 'This is a free board. Move either side. ' + (cfg.xme ? 'I will explain each move. ' : '') + 'Tap <b>Hint</b> for a suggestion or <b>Analyze</b> for my read on the position.';
    coachSay(first);
    const st0 = game.status();
    refresh();
    if (st0.over) endGame(st0);
    else if (isBotTurn()) botTurn(++token);
  },
};

initTheme();
window.addEventListener('hashchange', () => App.route());
App.route();

</script>

</body></html>
