<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pawn to Queen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed sidebar + one content column. Lesson and game pages are board on the left, coach panel on the right. */
:root {
  --bg: #312e2b; --side: #262421; --surface: #262421; --surface2: #2f2d2a; --raise: #3d3a37; --line: #3a3835;
  --fg: #ffffff; --fg2: #bdbab5; --green: #81b64c; --green-ink: #a3d160; --btn: #4b861f; --btn-d: #2f5a14;
  --bad: #d4433f; --info: #6db3f2; --warn: #e6b422; --shadow: 0 2px 0 rgba(0,0,0,.25);
  --sq-l: #eeeed2; --sq-d: #769656;
  --font: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ebe9e5; --side: #ffffff; --surface: #ffffff; --surface2: #f4f2ee; --raise: #e4e1db; --line: #d9d5ce;
  --fg: #2a2825; --fg2: #66625c; --green-ink: #3f6f1a; --shadow: 0 2px 0 rgba(0,0,0,.08); --info: #1f6fb8;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2 { text-wrap: balance; line-height: 1.2; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
[class*="pc-"] { background-size: contain; background-repeat: no-repeat; background-position: center; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100dvh; }
.side {
  position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 4px; background: var(--side);
  padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 800; font-size: 1.2rem; text-decoration: none; letter-spacing: -.01em; }
.logo i, .nav i { width: 32px; height: 32px; flex: none; display: block; }
.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--fg2); font-weight: 700; text-decoration: none; }
.nav a:hover { background: var(--surface2); color: var(--fg); }
.nav a.on { background: var(--raise); color: var(--fg); }
.foot { margin-top: auto; display: grid; gap: 6px; }
.sbtn { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; border: 0; background: transparent; color: var(--fg2); font-weight: 600; text-align: left; }
.sbtn b { width: 22px; text-align: center; font-size: 1.15rem; line-height: 1; }
.sbtn:hover { background: var(--surface2); color: var(--fg); }
.sbtn[aria-pressed="false"] { opacity: .6; }
.credit { margin: 6px 4px 0; font-size: .72rem; color: var(--fg2); line-height: 1.35; }
#view {
  min-width: 0; padding-block: 28px 48px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px);
  background: var(--raise); color: var(--fg); padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 50; box-shadow: 0 8px 28px rgba(0,0,0,.4); max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 8px;
  border: 0; border-bottom: 4px solid var(--btn-d); background: var(--btn); color: #fff; font-weight: 800; font-size: 15px; line-height: 1.2;
  text-decoration: none; transition: filter .12s, transform .06s; text-align: center;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.big { padding: 15px 26px; font-size: 18px; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-bottom-width: 3px; }
.btn.ghost { background: var(--raise); color: var(--fg); border-bottom-color: rgba(0,0,0,.28); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.pulse { animation: pulse 1.4s ease-in-out 2; }
.link { background: none; border: 0; padding: 0; color: var(--green-ink); font-weight: 700; text-decoration: underline; }
.card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }

/* ---------- home ---------- */
.home { max-width: 1040px; margin: 0 auto; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 380px); gap: 40px; align-items: center; margin-bottom: 28px; }
.eyebrow { margin: 0; color: var(--green-ink); font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; }
.hero h1 { margin: .15em 0 .2em; font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; letter-spacing: -.025em; }
.lead { margin: 0 0 22px; font-size: 1.15rem; color: var(--fg2); max-width: 50ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.meter { height: 10px; border-radius: 6px; background: var(--raise); overflow: hidden; margin-top: 26px; max-width: 420px; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
.meter-l { margin: 6px 0 0; color: var(--fg2); font-size: .9rem; font-variant-numeric: tabular-nums; }
.hero-board { width: 100%; max-width: 380px; justify-self: end; }
.skip { display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 18px 22px; margin-bottom: 24px; }
.skip h2 { margin: 0 0 4px; font-size: 1.15rem; }
.skip p { margin: 0; color: var(--fg2); max-width: 60ch; }
.skipped { color: var(--fg2); margin: -10px 0 18px; }
.mods { display: grid; gap: 20px; }
.mod { overflow: hidden; }
.mod-h { display: flex; gap: 14px; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.mod-ic { width: 46px; height: 46px; flex: none; }
.mod-h h2 { margin: 0; font-size: 1.2rem; }
.mod-h p { margin: 2px 0 0; color: var(--fg2); font-size: .92rem; }
.mod-c { margin-left: auto; font-weight: 800; color: var(--fg2); font-variant-numeric: tabular-nums; padding-left: 12px; }
.les-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.les { display: flex; gap: 12px; align-items: center; padding: 14px 22px; text-decoration: none; border-bottom: 1px solid var(--line); min-width: 0; }
.les:hover { background: var(--surface2); }
.les-n { width: 30px; height: 30px; border-radius: 50%; background: var(--raise); display: grid; place-items: center; font-weight: 800; font-size: .88rem; flex: none; }
.les.done .les-n { background: var(--btn); color: #fff; }
.les-t { display: flex; flex-direction: column; min-width: 0; }
.les-t small { color: var(--fg2); line-height: 1.3; }

/* ---------- board ---------- */
.board { position: relative; width: 100%; aspect-ratio: 1; user-select: none; -webkit-user-select: none; touch-action: none; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.board.active .b-squares { cursor: pointer; }
.b-squares { position: absolute; inset: 0; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); }
.sq { position: relative; }
.sq.l { background: var(--sq-l); } .sq.d { background: var(--sq-d); }
.sq::before { content: ""; position: absolute; inset: 0; }
.sq.last::before, .sq.sel::before { background: rgba(255, 235, 59, .5); }
.sq.hl::before { background: rgba(245, 166, 35, .55); }
.sq.mk-ok::before { background: rgba(129, 182, 76, .85); }
.sq.mk-bad::before { background: rgba(212, 67, 63, .8); }
.sq.chk::before { background: radial-gradient(circle, rgba(255,0,0,.95) 0, rgba(231,0,0,.55) 32%, rgba(169,0,0,0) 72%); }
.sq.dot::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,.2) 0 20%, transparent 22%); z-index: 1; }
.sq.cap::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, transparent 0 62%, rgba(0,0,0,.2) 64%); z-index: 1; }
.co { position: absolute; z-index: 1; font-weight: 800; font-size: clamp(9px, 1.5vw, 12px); line-height: 1; pointer-events: none; }
.co.rk { top: 3px; left: 4px; } .co.fl { right: 4px; bottom: 3px; }
.sq.l .co { color: var(--sq-d); } .sq.d .co { color: var(--sq-l); }
.b-arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.b-pieces { position: absolute; inset: 0; pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; z-index: 2; background-size: 94%; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .16s ease; will-change: transform; }
.piece.drag { transition: none; z-index: 6; background-size: 118%; }
.board.shake { animation: shake .35s; }
.promo { position: absolute; z-index: 10; width: 12.5%; display: flex; flex-direction: column; background: var(--surface); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.55); overflow: hidden; }
.promo-btn { aspect-ratio: 1; border: 0; background-color: transparent; background-size: 84%; }
.promo-btn:hover { background-color: var(--raise); }
.overlay { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(18,17,16,.62); border-radius: 6px; padding: 12px; }
.ov-card { background: var(--surface); padding: 22px 28px; border-radius: 12px; text-align: center; width: min(320px, 100%); box-shadow: 0 14px 44px rgba(0,0,0,.5); }
.ov-card h2 { margin: 0; font-size: 1.8rem; }
.ov-card p { margin: 4px 0 0; color: var(--fg2); }

/* ---------- lesson / game layout ---------- */
.crumbs { display: flex; gap: 12px; align-items: baseline; margin: 0 auto 14px; color: var(--fg2); font-weight: 700; max-width: 1100px; }
.crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--fg); }
.lesson { --bw: clamp(300px, calc(100dvh - 150px), 680px); display: grid; grid-template-columns: minmax(0, var(--bw)) minmax(300px, 420px); gap: 24px; justify-content: center; align-items: start; }
.lesson.game { --bw: clamp(300px, calc(100dvh - 215px), 660px); align-items: stretch; }
.bcol { min-width: 0; }
.board-box { position: relative; width: 100%; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tp { position: relative; width: 58px; height: 58px; border-radius: 10px; background: var(--surface); border: 2px solid var(--line); padding: 0; }
.tp span { position: absolute; inset: 4px; }
.tp em { position: absolute; right: 5px; bottom: 2px; font-style: normal; font-size: .75rem; font-weight: 800; color: var(--fg2); }
.tp.on { border-color: var(--green); background: var(--surface2); }
.tp.fin { opacity: .4; }
.tp.era { width: auto; padding: 0 14px; }
.tp.era em { position: static; font-size: .85rem; color: var(--fg); }

.panel { display: flex; flex-direction: column; min-width: 0; }
.ph { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ph b { display: block; line-height: 1.2; } .ph small { display: block; color: var(--fg2); line-height: 1.3; }
.av { width: 44px; height: 44px; border-radius: 50%; background-color: var(--btn); background-size: 80%; flex: none; display: block; }
.av.sm { width: 32px; height: 32px; } .av.you { background-color: var(--raise); }
.pbody { padding: 18px; flex: 1; min-height: 240px; overflow: auto; }
.pbody h2 { margin: 0 0 .5rem; font-size: 1.3rem; }
.body p { margin: .5em 0; max-width: 62ch; }
.fb { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; line-height: 1.45; }
.fb:not(:empty) { display: block; }
.fb.ok { background: rgba(129,182,76,.18); border-left: 4px solid var(--green); }
.fb.bad { background: rgba(212,67,63,.16); border-left: 4px solid var(--bad); }
.fb.info { background: var(--surface2); border-left: 4px solid var(--info); }
.extra { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 14px; }
.prog { margin: 0; color: var(--fg2); font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; width: 100%; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface2); border: 2px solid var(--line); font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--green); }
.opt .mk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fg2); flex: none; }
.opt.ok { border-color: var(--green); background: rgba(129,182,76,.18); } .opt.ok .mk { background: var(--green); border-color: var(--green); }
.opt.bad { border-color: var(--bad); opacity: .65; } .opt:disabled { cursor: default; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; width: 100%; }
.notes li { padding: 9px 11px; background: var(--surface2); border-radius: 8px; font-size: .93rem; line-height: 1.45; }
.notes b { color: var(--green-ink); margin-right: 6px; font-variant-numeric: tabular-nums; }
.pf { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; max-width: 150px; }
.dots .dot { width: 11px; height: 11px; padding: 0; border: 0; border-radius: 50%; background: var(--raise); }
.dots .dot.seen { background: var(--fg2); } .dots .dot.on { background: var(--green); transform: scale(1.25); } .dots .dot:disabled { cursor: default; }
.pbtns { display: flex; gap: 8px; }
.complete { text-align: center; padding: 26px 6px; }
.chk { width: 64px; height: 64px; border-radius: 50%; background: var(--btn); color: #fff; font-size: 34px; font-weight: 800; display: grid; place-items: center; margin: 0 auto 14px; }
.cbtns { display: grid; gap: 10px; margin-top: 18px; }

/* ---------- setup ---------- */
.setup { padding: 20px 22px 24px; display: grid; gap: 16px; align-content: start; }
.setup h1 { margin: 0; font-size: 1.6rem; }
.hint, .fine { margin: 0; color: var(--fg2); font-size: .9rem; }
.fine { font-size: .8rem; }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: var(--surface2); }
.seg button { flex: 1; padding: 9px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg2); font-weight: 700; }
.seg button.on { background: var(--raise); color: var(--fg); }
.field { display: grid; gap: 8px; } .field[hidden] { display: none; }
.field > label { font-weight: 700; }
.field output { color: var(--green-ink); font-weight: 800; margin-left: 6px; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--green); }
.elo-d { margin: 0; line-height: 1.4; } .elo-d b { color: var(--green-ink); }
.sw { position: relative; display: flex; gap: 12px; align-items: center; font-weight: 500; cursor: pointer; }
.sw input { position: absolute; opacity: 0; }
.sw span { width: 42px; height: 24px; border-radius: 12px; background: var(--raise); position: relative; flex: none; transition: background .15s; }
.sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw input:checked + span { background: var(--btn); } .sw input:checked + span::after { transform: translateX(18px); }
.sw input:focus-visible + span { outline: 2px solid var(--info); outline-offset: 2px; } .sw input:disabled + span { opacity: .4; }
select, input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 8px; background: var(--surface2); border: 2px solid var(--line); }
input[type="text"] { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.go { width: 100%; }

/* ---------- game ---------- */
.pbar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 2px; min-width: 0; }
.pbar b { white-space: nowrap; }
.pbar .elo { background: var(--raise); padding: 1px 7px; border-radius: 5px; font-size: .78rem; font-weight: 700; color: var(--fg2); }
.pbar .caps { display: flex; margin-left: 6px; padding-right: 7px; }
.pbar .caps i { display: block; width: 20px; height: 20px; margin-right: -8px; }
.pbar .lead { margin: 0 0 0 10px; color: var(--fg2); font-weight: 800; font-size: .85rem; }
.pbar.turn::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-left: auto; }
.gpanel { position: relative; min-height: 420px; }
.pin { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.spin { width: 18px; height: 18px; margin-left: auto; border-radius: 50%; border: 3px solid var(--raise); border-top-color: var(--green); animation: spin .8s linear infinite; }
.opening { padding: 8px 16px; background: var(--surface2); font-size: .92rem; border-bottom: 1px solid var(--line); }
.opening span { color: var(--fg2); text-transform: uppercase; letter-spacing: .09em; font-size: .72rem; margin-right: 6px; }
.feed { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg.coach { display: flex; gap: 10px; align-items: flex-start; }
.mb { min-width: 0; background: var(--surface2); border-radius: 4px 12px 12px 12px; padding: 10px 12px; line-height: 1.5; font-size: .95rem; }
.msg.sys { color: var(--fg2); text-align: center; font-size: .9rem; }
.grade { display: inline-block; padding: 1px 8px; border-radius: 5px; font-weight: 800; font-size: .78rem; color: #fff; margin-right: 4px; vertical-align: 1px; }
.g-best { background: #4b861f; } .g-good { background: #5e8f2a; } .g-inacc { background: #e6b422; color: #201c10; } .g-mistake { background: #c9741f; } .g-blunder { background: #c33a36; }
.movebox { display: flex; flex-direction: column; max-height: 34%; min-height: 100px; border-top: 1px solid var(--line); }
.mnav { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.mnav button { flex: 1; padding: 3px; border: 0; border-radius: 6px; background: var(--surface2); }
.mnav button:disabled { opacity: .35; cursor: default; }
.moves { overflow: auto; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.mrow { display: grid; grid-template-columns: 36px 1fr 1fr; gap: 4px; align-items: center; }
.mn { color: var(--fg2); font-size: .85rem; }
.mv { padding: 3px 6px; border: 0; border-radius: 4px; background: none; text-align: left; font-weight: 700; }
.mv:hover { background: var(--surface2); } .mv.on { background: var(--raise); } .mv.empty { color: var(--fg2); }
.gact { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }

@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes pulse { 50% { transform: scale(1.05); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 1060px) {
  .lesson { grid-template-columns: minmax(0, var(--bw)) minmax(280px, 1fr); gap: 18px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; inset: auto 0 0 0; height: auto; z-index: 20; flex-direction: row; align-items: center; gap: 4px; border-right: 0; border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .logo, .credit { display: none; }
  .nav { display: flex; flex: 1; gap: 2px; }
  .nav a { flex: 1; flex-direction: column; gap: 2px; padding: 6px 4px; font-size: .72rem; text-align: center; }
  .nav i { width: 26px; height: 26px; }
  .foot { margin: 0; display: flex; gap: 2px; }
  .sbtn { padding: 8px 8px; font-size: .72rem; }
  #view { padding-block: 18px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .hero-board { justify-self: center; }
  .lesson, .lesson.game { --bw: 100%; grid-template-columns: minmax(0, 1fr); }
  .gpanel { height: min(640px, 82dvh); min-height: 0; }
  .les-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .foot .sbtn span { display: none; }
  .mod-h { padding: 14px 16px; } .les { padding: 12px 16px; }

<script type="text/plain" id="engine-src">
/* Chess rules engine: 0x88 board, legal move generation, SAN, draws. */
const Chess = (function () {
  'use strict';
  const CAP = 1, EP = 2, CASTLE = 4, DBL = 8;
  const VAL = [0, 100, 320, 330, 500, 900, 0];
  const LET = ' PNBRQK';
  const FILES = 'abcdefgh';
  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const KN = [14, 18, 31, 33, -14, -18, -31, -33];
  const KG = [1, -1, 16, -16, 15, -15, 17, -17];
  const BD = [15, -15, 17, -17];
  const RD = [1, -1, 16, -16];
  const CR = new Int8Array(128).fill(15);
  CR[4] = 12; CR[0] = 13; CR[7] = 14; CR[116] = 3; CR[112] = 7; CR[119] = 11;

  const sqName = (s) => FILES[s & 7] + ((s >> 4) + 1);
  const sqNum = (n) => (n.charCodeAt(0) - 97) + ((n.charCodeAt(1) - 49) << 4);
  const mk = (f, t, pr, fl) => f | (t << 7) | (pr << 14) | (fl << 17);
  const mFrom = (m) => m & 127;
  const mTo = (m) => (m >> 7) & 127;
  const mPromo = (m) => (m >> 14) & 7;
  const mFlags = (m) => m >> 17;
  const uci = (m) => sqName(m & 127) + sqName((m >> 7) & 127) + (mPromo(m) ? LET[mPromo(m)].toLowerCase() : '');

  class Position {
    constructor(fen) {
      this.b = new Int8Array(128);
      this.kp = [0, 0];
      this.turn = 0; this.castle = 0; this.ep = -1; this.half = 0; this.full = 1;
      this.sm = []; this.sc = []; this.scs = []; this.se = []; this.sh = []; this.n = 0;
      this.load(fen || START);
    }

    load(fen) {
      const parts = fen.trim().split(/\s+/);
      this.b.fill(0);
      let r = 7, f = 0;
      for (const ch of parts[0]) {
        if (ch === '/') { r--; f = 0; }
        else if (ch >= '1' && ch <= '8') f += +ch;
        else {
          const t = LET.indexOf(ch.toUpperCase());
          const c = ch === ch.toUpperCase() ? 0 : 1;
          const s = r * 16 + f;
          this.b[s] = t | (c << 3);
          if (t === 6) this.kp[c] = s;
          f++;
        }
      }
      this.turn = parts[1] === 'b' ? 1 : 0;
      const cs = parts[2] || '-';
      this.castle = (cs.includes('K') ? 1 : 0) | (cs.includes('Q') ? 2 : 0) | (cs.includes('k') ? 4 : 0) | (cs.includes('q') ? 8 : 0);
      this.ep = parts[3] && parts[3] !== '-' ? sqNum(parts[3]) : -1;
      this.half = +parts[4] || 0;
      this.full = +parts[5] || 1;
      this.n = 0;
      return this;
    }

    fen() {
      let s = '';
      for (let r = 7; r >= 0; r--) {
        let e = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.b[r * 16 + f];
          if (!p) e++;
          else {
            if (e) { s += e; e = 0; }
            const ch = LET[p & 7];
            s += (p >> 3) ? ch.toLowerCase() : ch;
          }
        }
        if (e) s += e;
        if (r) s += '/';
      }
      const c = (this.castle & 1 ? 'K' : '') + (this.castle & 2 ? 'Q' : '') + (this.castle & 4 ? 'k' : '') + (this.castle & 8 ? 'q' : '');
      return s + ' ' + (this.turn ? 'b' : 'w') + ' ' + (c || '-') + ' ' + (this.ep >= 0 ? sqName(this.ep) : '-') + ' ' + this.half + ' ' + this.full;
    }

    clone() { return new Position(this.fen()); }

    // Position identity for repetition: placement, side, rights, and ep only if capturable.
    key() {
      let s = '';
      for (let i = 0; i < 120; i++) { if (i & 0x88) { i += 7; continue; } s += this.b[i] ? String.fromCharCode(64 + this.b[i]) : '.'; }
      let ep = '-';
      if (this.ep >= 0) {
        const pawn = 1 | (this.turn << 3), d = this.turn === 0 ? -16 : 16;
        for (const o of [-1, 1]) { const q = this.ep + d + o; if (!(q & 0x88) && this.b[q] === pawn) ep = this.ep; }
      }
      return s + this.turn + this.castle + ep;
    }

    attacked(sq, by) {
      const b = this.b;
      const pawn = 1 | (by << 3);
      const pd = by === 0 ? -16 : 16;
      let q = sq + pd - 1; if (!(q & 0x88) && b[q] === pawn) return true;
      q = sq + pd + 1; if (!(q & 0x88) && b[q] === pawn) return true;
      const kn = 2 | (by << 3), kg = 6 | (by << 3);
      for (let i = 0; i < 8; i++) {
        q = sq + KN[i]; if (!(q & 0x88) && b[q] === kn) return true;
        q = sq + KG[i]; if (!(q & 0x88) && b[q] === kg) return true;
      }
      const bi = 3 | (by << 3), ro = 4 | (by << 3), qu = 5 | (by << 3);
      for (let i = 0; i < 4; i++) {
        q = sq + BD[i];
        while (!(q & 0x88)) { const p = b[q]; if (p) { if (p === bi || p === qu) return true; break; } q += BD[i]; }
        q = sq + RD[i];
        while (!(q & 0x88)) { const p = b[q]; if (p) { if (p === ro || p === qu) return true; break; } q += RD[i]; }
      }
      return false;
    }

    // Squares of `by`-coloured pieces that attack sq (ignores pins).
    attackers(sq, by) {
      const b = this.b, out = [];
      const pawn = 1 | (by << 3), pd = by === 0 ? -16 : 16;
      let q = sq + pd - 1; if (!(q & 0x88) && b[q] === pawn) out.push(q);
      q = sq + pd + 1; if (!(q & 0x88) && b[q] === pawn) out.push(q);
      for (let i = 0; i < 8; i++) {
        q = sq + KN[i]; if (!(q & 0x88) && b[q] === (2 | (by << 3))) out.push(q);
        q = sq + KG[i]; if (!(q & 0x88) && b[q] === (6 | (by << 3))) out.push(q);
      }
      for (let i = 0; i < 4; i++) {
        q = sq + BD[i];
        while (!(q & 0x88)) { const p = b[q]; if (p) { if (p === (3 | (by << 3)) || p === (5 | (by << 3))) out.push(q); break; } q += BD[i]; }
        q = sq + RD[i];
        while (!(q & 0x88)) { const p = b[q]; if (p) { if (p === (4 | (by << 3)) || p === (5 | (by << 3))) out.push(q); break; } q += RD[i]; }
      }
      return out;
    }

    inCheck() { return this.attacked(this.kp[this.turn], this.turn ^ 1); }

    gen(captOnly) {
      const mv = [], b = this.b, us = this.turn, them = us ^ 1;
      for (let s = 0; s < 120; s++) {
        if (s & 0x88) { s += 7; continue; }
        const p = b[s];
        if (!p || (p >> 3) !== us) continue;
        const t = p & 7;
        if (t === 1) {
          const dir = us === 0 ? 16 : -16, start = us === 0 ? 1 : 6, pr = us === 0 ? 6 : 1, r = s >> 4;
          let to = s + dir;
          if (!(to & 0x88) && b[to] === 0) {
            if (r === pr) { mv.push(mk(s, to, 5, 0)); if (!captOnly) mv.push(mk(s, to, 4, 0), mk(s, to, 3, 0), mk(s, to, 2, 0)); }
            else if (!captOnly) {
              mv.push(mk(s, to, 0, 0));
              if (r === start && b[to + dir] === 0) mv.push(mk(s, to + dir, 0, DBL));
            }
          }
          for (let k = -1; k <= 1; k += 2) {
            to = s + dir + k;
            if (to & 0x88) continue;
            const tp = b[to];
            if (tp && (tp >> 3) === them) {
              if (r === pr) mv.push(mk(s, to, 5, CAP), mk(s, to, 4, CAP), mk(s, to, 3, CAP), mk(s, to, 2, CAP));
              else mv.push(mk(s, to, 0, CAP));
            } else if (!tp && to === this.ep) mv.push(mk(s, to, 0, EP | CAP));
          }
        } else if (t === 2 || t === 6) {
          const offs = t === 2 ? KN : KG;
          for (let i = 0; i < 8; i++) {
            const to = s + offs[i];
            if (to & 0x88) continue;
            const tp = b[to];
            if (!tp) { if (!captOnly) mv.push(mk(s, to, 0, 0)); }
            else if ((tp >> 3) === them) mv.push(mk(s, to, 0, CAP));
          }
        } else {
          const dirs = t === 3 ? BD : t === 4 ? RD : KG;
          for (let i = 0; i < dirs.length; i++) {
            let to = s + dirs[i];
            while (!(to & 0x88)) {
              const tp = b[to];
              if (!tp) { if (!captOnly) mv.push(mk(s, to, 0, 0)); }
              else { if ((tp >> 3) === them) mv.push(mk(s, to, 0, CAP)); break; }
              to += dirs[i];
            }
          }
        }
      }
      if (!captOnly) {
        if (us === 0 && b[4] === 6) {
          if ((this.castle & 1) && !b[5] && !b[6] && !this.attacked(4, 1) && !this.attacked(5, 1) && !this.attacked(6, 1)) mv.push(mk(4, 6, 0, CASTLE));
          if ((this.castle & 2) && !b[3] && !b[2] && !b[1] && !this.attacked(4, 1) && !this.attacked(3, 1) && !this.attacked(2, 1)) mv.push(mk(4, 2, 0, CASTLE));
        } else if (us === 1 && b[116] === 14) {
          if ((this.castle & 4) && !b[117] && !b[118] && !this.attacked(116, 0) && !this.attacked(117, 0) && !this.attacked(118, 0)) mv.push(mk(116, 118, 0, CASTLE));
          if ((this.castle & 8) && !b[115] && !b[114] && !b[113] && !this.attacked(116, 0) && !this.attacked(115, 0) && !this.attacked(114, 0)) mv.push(mk(116, 114, 0, CASTLE));
        }
      }
      return mv;
    }

    make(m) {
      const f = m & 127, t = (m >> 7) & 127, pr = (m >> 14) & 7, fl = m >> 17, b = this.b, us = this.turn;
      const p = b[f];
      let cap = b[t];
      if (fl & EP) { const cs = t + (us === 0 ? -16 : 16); cap = b[cs]; b[cs] = 0; }
      const n = this.n++;
      this.sm[n] = m; this.sc[n] = cap; this.scs[n] = this.castle; this.se[n] = this.ep; this.sh[n] = this.half;
      b[t] = pr ? (pr | (us << 3)) : p;
      b[f] = 0;
      if (fl & CASTLE) {
        if (t > f) { b[t - 1] = b[t + 1]; b[t + 1] = 0; }
        else { b[t + 1] = b[t - 2]; b[t - 2] = 0; }
      }
      if ((p & 7) === 6) this.kp[us] = t;
      this.castle &= CR[f] & CR[t];
      this.ep = (fl & DBL) ? (f + t) >> 1 : -1;
      this.half = ((p & 7) === 1 || cap) ? 0 : this.half + 1;
      if (us === 1) this.full++;
      this.turn ^= 1;
    }

    unmake() {
      const n = --this.n, m = this.sm[n];
      const f = m & 127, t = (m >> 7) & 127, pr = (m >> 14) & 7, fl = m >> 17, b = this.b;
      this.turn ^= 1;
      const us = this.turn;
      const p = pr ? (1 | (us << 3)) : b[t];
      b[f] = p;
      if (fl & EP) { b[t] = 0; b[t + (us === 0 ? -16 : 16)] = this.sc[n]; }
      else b[t] = this.sc[n];
      if (fl & CASTLE) {
        if (t > f) { b[t + 1] = b[t - 1]; b[t - 1] = 0; }
        else { b[t - 2] = b[t + 1]; b[t + 1] = 0; }
      }
      if ((p & 7) === 6) this.kp[us] = f;
      this.castle = this.scs[n]; this.ep = this.se[n]; this.half = this.sh[n];
      if (us === 1) this.full--;
    }

    legal() {
      const out = [], us = this.turn;
      for (const m of this.gen(false)) {
        this.make(m);
        if (!this.attacked(this.kp[us], us ^ 1)) out.push(m);
        this.unmake();
      }
      return out;
    }

    movesFrom(sq) { return this.legal().filter((m) => (m & 127) === sq); }

    find(from, to, promo) {
      for (const m of this.legal()) {
        if ((m & 127) === from && ((m >> 7) & 127) === to) {
          const pr = (m >> 14) & 7;
          if (!pr || pr === (promo || 5)) return m;
        }
      }
      return 0;
    }

    san(m, legalList) {
      const f = m & 127, t = (m >> 7) & 127, pr = (m >> 14) & 7, fl = m >> 17;
      const p = this.b[f], pt = p & 7;
      let s;
      if (fl & CASTLE) s = t > f ? 'O-O' : 'O-O-O';
      else {
        const dest = sqName(t);
        if (pt === 1) {
          s = (fl & CAP) ? FILES[f & 7] + 'x' + dest : dest;
          if (pr) s += '=' + LET[pr];
        } else {
          s = LET[pt];
          const others = (legalList || this.legal()).filter((o) => o !== m && ((o >> 7) & 127) === t && (this.b[o & 127] & 7) === pt);
          if (others.length) {
            let sameFile = false, sameRank = false;
            for (const o of others) {
              if ((o & 7) === (f & 7)) sameFile = true;
              if (((o & 127) >> 4) === (f >> 4)) sameRank = true;
            }
            if (!sameFile) s += FILES[f & 7];
            else if (!sameRank) s += (f >> 4) + 1;
            else s += sqName(f);
          }
          if (fl & CAP) s += 'x';
          s += dest;
        }
      }
      this.make(m);
      if (this.inCheck()) s += this.legal().length ? '+' : '#';
      this.unmake();
      return s;
    }

    parse(str) {
      const s = str.trim();
      const legal = this.legal();
      if (/^[a-h][1-8][a-h][1-8][qrbnQRBN]?$/.test(s)) {
        const pr = s[4] ? LET.indexOf(s[4].toUpperCase()) : 0;
        return this.find(sqNum(s.slice(0, 2)), sqNum(s.slice(2, 4)), pr) || 0;
      }
      const clean = (x) => x.replace(/[+#!?]/g, '').replace(/0/g, 'O').replace('=', '');
      const want = clean(s);
      for (const m of legal) if (clean(this.san(m, legal)) === want) return m;
      return 0;
    }

    perft(d) {
      if (d === 0) return 1;
      let n = 0;
      for (const m of this.legal()) { this.make(m); n += this.perft(d - 1); this.unmake(); }
      return n;
    }

    insufficient() {
      const minors = []; let sqc = [];
      for (let s = 0; s < 120; s++) {
        if (s & 0x88) { s += 7; continue; }
        const t = this.b[s] & 7;
        if (!t || t === 6) continue;
        if (t === 1 || t === 4 || t === 5) return false;
        minors.push(t);
        if (t === 3) sqc.push(((s >> 4) + (s & 7)) & 1);
      }
      if (minors.length <= 1) return true;
      return minors.every((t) => t === 3) && sqc.every((c) => c === sqc[0]);
    }
  }

  class Game {
    constructor(fen) {
      this.pos = new Position(fen || START);
      this.startFen = this.pos.fen();
      this.keys = [this.pos.key()];
      this.hist = [];
    }
    play(m) {
      const san = this.pos.san(m);
      const fenBefore = this.pos.fen();
      this.pos.make(m);
      this.keys.push(this.pos.key());
      this.hist.push({ m, san, fenBefore, uci: uci(m) });
      return san;
    }
    undo() {
      if (!this.hist.length) return null;
      this.pos.unmake(); this.keys.pop();
      return this.hist.pop();
    }
    status() {
      const p = this.pos, legal = p.legal();
      if (!legal.length) {
        if (p.inCheck()) return { over: true, reason: 'checkmate', winner: p.turn ^ 1, result: p.turn ? '1-0' : '0-1' };
        return { over: true, reason: 'stalemate', winner: null, result: '1/2-1/2' };
      }
      if (p.insufficient()) return { over: true, reason: 'insufficient', winner: null, result: '1/2-1/2' };
      if (p.half >= 100) return { over: true, reason: 'fifty', winner: null, result: '1/2-1/2' };
      const k = this.keys[this.keys.length - 1];
      let c = 0;
      for (const x of this.keys) if (x === k) c++;
      if (c >= 3) return { over: true, reason: 'repetition', winner: null, result: '1/2-1/2' };
      return { over: false, check: p.inCheck() };
    }
  }

  return { Position, Game, START, VAL, LET, FILES, CAP, EP, CASTLE, DBL, KN, KG, BD, RD, sqName, sqNum, mFrom, mTo, mPromo, mFlags, uci, mk };
})();
if (typeof module !== 'undefined') module.exports = { Chess };

const Search = (function () {

    this.flipped = this.o.orientation === 'b';
    this.mode = 'none';               // none | move | tap

    this.last = null; this.sel = -1; this.targets = []; this.hl = []; this.marks = {}; this.checkSq = -1;

    this.pcLayer = $el('div', 'b-pieces');

    this.svg.setAttribute('class', 'b-arrows');
    this.svg.setAttribute('viewBox', '0 0 8 8');

        { t: 'move', title: 'Capture the pawn', fen: 'k7/8/8/8/8/3p1p2/4P3/K7 w - - 0 1', ok: ['e2f3', 'e2d3'], hint: 'Capture one of the black pawns diagonally.', win: 'Right. The pawn took diagonally and now stands where the enemy pawn was.' },
        { t: 'quiz', title: 'Blocked', fen: 'k7/8/8/8/4p3/4P3/8/K7 w - - 0 1', body: 'The white pawn on e3 faces a black pawn on e4. Can it capture it?', options: ['Yes, by moving forward', 'No, the pawns are blocked'], answer: 1, why: 'Pawns cannot capture straight ahead. Two pawns facing each other block one another.' },
        { t: 'text', title: 'A pawn\'s dream', body: 'When a pawn reaches the far end of the board it is <b>promoted</b> and becomes a stronger piece, usually a queen. You will practice that in the Rules lessons.' },
      ],
    },
    {
      id: 'rook', title: 'The rook', sub: 'Straight lines, any distance',
      practice: { fen: 'k7/8/8/8/3R4/8/8/K7 w - - 0 1', label: 'Rook in the open' },
      steps: [
        { t: 'text', title: 'Straight lines', fen: 'k7/8/8/8/3R4/8/8/K7 w - - 0 1', arrows: [['d4', 'd8'], ['d4', 'd1'], ['d4', 'a4'], ['d4', 'h4']], body: 'The rook moves in <b>straight lines</b>: forward, backward, left or right, as far as it likes.\n\nIt cannot jump over pieces. It stops before its own pieces, and can capture the first enemy piece in its way.' },
        { t: 'explore', title: 'Try it', fen: 'k7/8/8/8/3R4/8/8/K7 w - - 0 1', need: 3, body: 'Move the rook around. Notice the rook on an open board controls 14 squares.' },
        { t: 'move', title: 'Capture the knight', fen: 'k7/3n4/8/8/3R4/8/8/K7 w - - 0 1', ok: ['d4d7'], hint: 'The knight is on the same file as your rook.', win: 'Rook takes knight. Rooks are strong on open files.' },
        { t: 'text', title: 'Worth remembering', body: 'A rook is worth about <b>5 pawns</b>. It is a major piece, strongest when the board opens up.' },
      ],
    },
    {
      id: 'bishop', title: 'The bishop', sub: 'Diagonals only',
      practice: { fen: 'k7/6p1/8/8/3B4/8/8/K7 w - - 0 1', label: 'Hunt with the bishop' },
      steps: [
        { t: 'text', title: 'Diagonals', fen: 'k7/8/8/8/3B4/8/8/K7 w - - 0 1', arrows: [['d4', 'a7'], ['d4', 'g7'], ['d4', 'a1'], ['d4', 'g1']], body: 'The bishop moves <b>diagonally</b>, any number of squares, but cannot jump over pieces.\n\nBecause of that, a bishop always stays on the same color of square it started on. You have a light-squared bishop and a dark-squared bishop.' },
        { t: 'explore', title: 'Try it', fen: 'k7/8/8/8/3B4/8/8/K7 w - - 0 1', need: 3, body: 'Move the bishop. Notice it can never reach a square of the other color.' },
        { t: 'move', title: 'Capture the pawn', fen: 'k7/6p1/8/8/3B4/8/8/K7 w - - 0 1', ok: ['d4g7'], hint: 'Follow the diagonal up and to the right.', win: 'Bishop takes pawn. A bishop can strike from far away.' },
        { t: 'text', title: 'Worth remembering', body: 'A bishop is worth about <b>3 pawns</b>, the same as a knight. Two bishops working together are especially strong because they cover both colors.' },
      ],
    },
    {
      id: 'knight', title: 'The knight', sub: 'The jumper',
      practice: { fen: 'k7/8/4r3/8/3N4/8/8/K7 w - - 0 1', label: 'Knight jumps' },
      steps: [
        { t: 'text', title: 'The L shape', fen: 'k7/8/8/8/3N4/8/8/K7 w - - 0 1', arrows: [['d4', 'b5'], ['d4', 'b3'], ['d4', 'c6'], ['d4', 'e6'], ['d4', 'f5'], ['d4', 'f3'], ['d4', 'c2'], ['d4', 'e2']], body: 'The knight moves in an <b>L shape</b>: two squares in one direction, then one square sideways.\n\nIt is the only piece that can <b>jump over other pieces</b>.' },
        { t: 'explore', title: 'Jump over anything', fen: 'k7/8/8/2PPP3/2PNP3/2PPP3/8/K7 w - - 0 1', need: 2, body: 'This knight is completely surrounded by its own pawns, yet it can still jump out. Try it.' },
        { t: 'move', title: 'Capture the rook', fen: 'k7/8/4r3/8/3N4/8/8/K7 w - - 0 1', ok: ['d4e6'], hint: 'Count two squares up and one to the right.', win: 'A knight capturing a rook wins material. The knight is worth 3, the rook 5.' },
        { t: 'text', title: 'Worth remembering', body: 'A knight is worth about <b>3 pawns</b>. It is best in the middle of the board, where it reaches the most squares. A knight in the corner reaches only two.' },
      ],
    },
    {
      id: 'queen', title: 'The queen', sub: 'The most powerful piece',
      practice: { fen: 'k7/8/8/8/3Q3r/8/8/K7 w - - 0 1', label: 'Queen on the loose' },
      steps: [
        { t: 'text', title: 'Rook plus bishop', fen: 'k7/8/8/8/3Q4/8/8/K7 w - - 0 1', arrows: [['d4', 'd8'], ['d4', 'd1'], ['d4', 'a4'], ['d4', 'h4'], ['d4', 'a7'], ['d4', 'g7'], ['d4', 'a1'], ['d4', 'g1']], body: 'The queen moves like a <b>rook and a bishop combined</b>: any number of squares in a straight line or diagonal.\n\nShe cannot jump either. She is worth about <b>9 pawns</b>.' },
        { t: 'explore', title: 'Try it', fen: 'k7/8/8/8/3Q4/8/8/K7 w - - 0 1', need: 3, body: 'Move the queen around. She covers a huge part of the board from the center.' },
        { t: 'move', title: 'Capture the rook', fen: 'k7/8/8/8/3Q3r/8/8/K7 w - - 0 1', ok: ['d4h4'], hint: 'The rook is on your rank.', win: 'Queen takes rook. But be careful: the queen is precious, so do not lose her for a smaller piece.' },
      ],
    },
    {
      id: 'king', title: 'The king', sub: 'Slow, vital, and never allowed into danger',
      practice: { fen: '4r1k1/8/8/8/3K4/8/8/8 w - - 0 1', label: 'Walk the king' },
      steps: [
        { t: 'text', title: 'One step at a time', fen: 'k7/8/8/8/3K4/8/8/8 w - - 0 1', arrows: [['d4', 'd5'], ['d4', 'c5'], ['d4', 'e5'], ['d4', 'c4'], ['d4', 'e4'], ['d4', 'c3'], ['d4', 'd3'], ['d4', 'e3']], body: 'The king moves <b>one square in any direction</b>.\n\nIt is the most important piece. If your king is trapped and cannot escape an attack, you lose the game.' },
        { t: 'text', title: 'No walking into danger', fen: '4r2k/8/8/8/3K4/8/8/8 w - - 0 1', hl: fileSq('e'), body: 'A king can <b>never move to a square that an enemy piece attacks</b>. Here the black rook controls the whole e-file, so the white king cannot step onto it.' },
        { t: 'explore', title: 'Try it', fen: '4r2k/8/8/8/3K4/8/8/8 w - - 0 1', need: 3, body: 'Tap the king. The e-file squares are not offered, because the rook guards them.' },
        { t: 'quiz', title: 'Kings and kings', fen: '8/8/8/3k4/8/3K4/8/8 w - - 0 1', body: 'Can the white king move to d4, next to the black king?', options: ['Yes', 'No'], answer: 1, why: 'The two kings can never stand next to each other, since each one attacks the squares around it.' },
      ],
    },
    {
      id: 'values', title: 'Capturing and piece values', sub: 'Good trades and bad trades',
      steps: [
        { t: 'text', title: 'Capturing', fen: 'k7/8/8/3q4/4P3/8/8/K7 w - - 0 1', arrows: [['e4', 'd5', 'r']], body: 'To capture, move your piece onto a square held by an enemy piece. The enemy piece is removed from the board. In chess you are never forced to capture, except when you have no other way to escape check.' },
        { t: 'text', title: 'What are pieces worth?', body: 'Players score pieces in points to judge trades:\n\n<b>Pawn 1 · Knight 3 · Bishop 3 · Rook 5 · Queen 9</b>\n\nThe king has no value because losing it ends the game.' },
        { t: 'move', title: 'Pawn takes queen', fen: 'k7/8/8/3q4/4P3/8/8/K7 w - - 0 1', ok: ['e4d5'], hint: 'Your pawn attacks diagonally.', win: 'A cheap piece capturing an expensive one is the best kind of trade.' },
        { t: 'quiz', title: 'Is it a good trade?', body: 'You capture a rook (5 points) but your knight (3 points) is captured in return. What is the result?', options: ['You gain 2 points', 'You lose 2 points', 'It is equal'], answer: 0, why: '5 gained minus 3 lost is +2. Always count before you trade.' },
      ],
    },
    {
      id: 'check', title: 'Check', sub: 'When the king is attacked',
      practice: { fen: '1k6/8/8/8/8/8/8/R3K2r w - - 0 1', label: 'Escape the check' },
      steps: [
        { t: 'text', title: 'What is check?', fen: '1k6/8/8/8/8/8/8/R3K2r w - - 0 1', arrows: [['h1', 'e1', 'r']], body: 'When a king is attacked, it is in <b>check</b>. The player must fix it immediately. You may never leave your own king in check.\n\nThere are exactly three ways out: <b>move the king, capture the attacker, or block the attack</b> with another piece.' },
        { t: 'move', title: 'Way 1: move the king', fen: '1k6/8/8/8/8/8/8/R3K2r w - - 0 1', ok: ['e1d2', 'e1e2', 'e1f2'], hint: 'Step off the first rank.', win: 'The king stepped away from the rook\'s line.' },
        { t: 'move', title: 'Way 2: capture the attacker', fen: '1k6/8/8/8/8/5n2/6P1/4K3 w - - 0 1', ok: ['g2f3'], hint: 'The knight on f3 gives check. A pawn can capture it.', win: 'Check removed by taking the checking piece.' },
        { t: 'move', title: 'Way 3: block', fen: '1k2r3/8/8/8/8/2B5/8/4K3 w - - 0 1', ok: ['c3e5'], hint: 'Put the bishop between the rook and the king.', win: 'Blocked. A knight check cannot be blocked, but a rook, bishop or queen check can.' },
        { t: 'text', title: 'Checkmate', body: 'If a king is in check and <b>none of the three escapes works</b>, it is <b>checkmate</b> and the game ends. You will study mating patterns in the Checkmates module.' },
      ],
    },
    {
      id: 'castling', title: 'Castling', sub: 'The only move with two pieces',
      practice: { fen: 'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', label: 'Castle in a game' },
      steps: [
        { t: 'text', title: 'Safety and activity', fen: 'r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1', arrows: [['e1', 'g1'], ['h1', 'f1']], body: 'Castling moves your king to safety and brings a rook into play in one move.\n\nThe king moves <b>two squares toward a rook</b>, and that rook jumps over the king to the square next to it.' },
        { t: 'move', title: 'Castle kingside', fen: 'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', ok: ['e1g1'], hint: 'Move the king two squares toward the h1 rook.', win: 'Kingside castling, written O-O. The king is tucked in the corner.' },
        { t: 'move', title: 'Castle queenside', fen: 'r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1', ok: ['e1c1'], hint: 'Move the king two squares toward the a1 rook.', win: 'Queenside castling, written O-O-O. The king lands on c1 and the rook on d1.' },
        { t: 'text', title: 'The rules', body: 'You can castle only if:\n\n• the king and that rook have <b>never moved</b>\n• <b>no pieces</b> stand between them\n• the king is <b>not in check</b>\n• the king does <b>not pass through or land on</b> an attacked square' },
        { t: 'quiz', title: 'Can White castle?', fen: 'r4rk1/8/8/8/8/8/8/R3K2R w KQ - 0 1', body: 'The black rook on f8 controls the f-file. Which castling moves are legal for White?', options: ['Kingside only', 'Queenside only', 'Both', 'Neither'], answer: 1, why: 'Kingside is not allowed because the king would pass through f1, which the rook attacks. Queenside is fine: no square the king crosses is attacked.' },
      ],
    },
    {
      id: 'setup', title: 'Setting up a real board', sub: 'For playing over the board',
      steps: [
        { t: 'text', title: 'Before you place anything', fen: EMPTY, body: 'Turn the board so there is a <b>light square in the bottom-right corner</b> of each player\'s side.\n\nWhite sits at the bottom, Black at the top. We will build White\'s side first. To place a piece, pick it from the tray, then tap its square.' },
        { t: 'place', title: 'Pawns', fen: EMPTY, body: 'Fill the whole <b>second rank</b> with White pawns.', targets: Object.fromEntries('abcdefgh'.split('').map((f) => [f + '2', 'P'])) },
        { t: 'place', title: 'Rooks', fen: '8/8/8/8/8/8/PPPPPPPP/8 w - - 0 1', body: 'Rooks go in the <b>corners</b>: a1 and h1.', targets: { a1: 'R', h1: 'R' } },
        { t: 'place', title: 'Knights', fen: '8/8/8/8/8/8/PPPPPPPP/R6R w - - 0 1', body: 'Knights stand <b>next to the rooks</b>: b1 and g1.', targets: { b1: 'N', g1: 'N' } },
        { t: 'place', title: 'Bishops', fen: '8/8/8/8/8/8/PPPPPPPP/RN4NR w - - 0 1', body: 'Bishops stand <b>next to the knights</b>: c1 and f1.', targets: { c1: 'B', f1: 'B' } },
        { t: 'place', title: 'Queen', fen: '8/8/8/8/8/8/PPPPPPPP/RNB2BNR w - - 0 1', body: 'The queen goes on <b>her own color</b>: the white queen on the light square d1.', targets: { d1: 'Q' } },
        { t: 'place', title: 'King', fen: '8/8/8/8/8/8/PPPPPPPP/RNBQ1BNR w - - 0 1', body: 'The king takes the last free square, e1.', targets: { e1: 'K' } },
        { t: 'place', title: 'Black mirrors White', fen: OPENING_START.replace(/^[^/]+\/[^/]+\//, '8/8/'), body: 'Now Black. Place the pieces directly <b>opposite</b> White\'s: the back rank on rank 8 and pawns on rank 7. The black queen goes on the dark square d8, so <b>queen on her color</b>. Black\'s king faces White\'s king.', targets: Object.assign(Object.fromEntries('abcdefgh'.split('').map((f, i) => [f + '8', 'rnbqkbnr'[i]])), Object.fromEntries('abcdefgh'.split('').map((f) => [f + '7', 'p']))) },
        { t: 'text', title: 'Done', fen: OPENING_START, body: 'That is the starting position. Quick memory aids:\n\n• <b>Light square on the right.</b>\n• <b>Queen on her color.</b>\n• <b>The two kings face each other</b> on the e-file.' },
      ],
    },
  ],
});

COURSE.modules.push({
  id: 'rules',
  title: 'Special Moves and Reading the Game',
  sub: 'En passant, promotion, notation, and the rules of a real game.',
  lessons: [
    {
      id: 'enpassant', title: 'En passant', sub: 'The pawn capture most beginners have never seen',
      practice: { fen: 'k7/8/8/3pP3/8/8/8/K7 w - d6 0 1', label: 'En passant position' },
      steps: [
        { t: 'text', title: 'Passing by', fen: 'k7/3p4/8/4P3/8/8/8/K7 b - - 0 1', body: 'Here a white pawn sits on e5. Black has a pawn on d7 that has not moved yet.\n\nIf Black jumps two squares with d7-d5, the black pawn lands <b>next to</b> your pawn. It slipped past the square d6 that your pawn attacks.' },
        { t: 'line', title: 'Play Black\'s move', fen: 'k7/3p4/8/4P3/8/8/8/K7 b - - 0 1', as: 'b', line: ['d7d5', 'e5d6'], notes: ['Black jumps two squares and passes the e5 pawn.', 'White captures <b>en passant</b> ("in passing"), as if the black pawn had moved only one square. The black pawn on d5 is removed.'], hint: 'Move the d-pawn two squares.' },
        { t: 'move', title: 'Capture en passant', fen: 'k7/8/8/3pP3/8/8/8/K7 w - d6 0 1', ok: ['e5d6'], hint: 'Capture diagonally onto d6, the square the black pawn jumped over.', win: 'That is en passant. The black pawn on d5 disappears, even though your pawn did not land on it.' },
        { t: 'text', title: 'The rules', body: 'En passant is legal only when:\n\n• your pawn is on its <b>fifth rank</b> (White) or fourth rank (Black)\n• the enemy pawn has just made a <b>two-square jump</b> next to it\n• you capture <b>immediately on the next move</b>. If you wait, the chance is gone.' },
        { t: 'quiz', title: 'Is it allowed?', fen: 'k7/8/8/3pP3/8/8/8/K7 w - - 0 1', body: 'The black pawn has stood on d5 for several moves, and Black\'s last move was a king move. Can you capture it en passant now?', options: ['Yes', 'No'], answer: 1, why: 'No. You must capture en passant on the very next move after the two-square jump. The chance has passed.' },
      ],
    },
    {
      id: 'promotion', title: 'Promotion', sub: 'Turning a pawn into a new piece',
      practice: { fen: '8/5k1P/6q1/8/8/8/8/K7 w - - 0 1', label: 'Promotion position' },
      steps: [
        { t: 'text', title: 'Reach the end', fen: 'k7/4P3/8/8/8/8/8/K7 w - - 0 1', arrows: [['e7', 'e8']], body: 'A pawn that reaches the last rank <b>must</b> promote to a queen, rook, bishop or knight of its own color. You can have two or more queens.\n\nPromotion is why one extra pawn in the endgame can win the game.' },
        { t: 'move', title: 'Promote the pawn', fen: 'k7/4P3/8/8/8/8/8/K7 w - - 0 1', ok: ['e7e8q', 'e7e8r', 'e7e8b', 'e7e8n'], hint: 'Push the pawn to the last rank, then choose a piece.', win: 'Promoted. Nearly always a queen is best, the strongest piece.' },
        { t: 'move', title: 'Promote by capturing', fen: 'k2r4/4P3/8/8/8/8/8/K7 w - - 0 1', ok: ['e7d8q', 'e7d8r', 'e7d8b', 'e7d8n'], hint: 'The pawn can capture diagonally onto the last rank, and promote while doing it.', win: 'A capture and a promotion in one move.' },
        { t: 'move', title: 'When a knight beats a queen', fen: '8/5k1P/6q1/8/8/8/8/K7 w - - 0 1', ok: ['h7h8n'], hint: 'A knight on h8 attacks both f7 and g6. Promote to a knight.', win: 'Underpromotion! The knight gives check and attacks the queen at the same time, so you win the queen next move. A queen on h8 would not do this.' },
      ],
    },
    {
      id: 'notation', title: 'Reading and writing moves', sub: 'Algebraic notation',
      steps: [
        { t: 'text', title: 'One language for every game', fen: OPENING_START, body: 'Chess moves are recorded in <b>algebraic notation</b>. Each piece has a letter:\n\n<b>K</b> king · <b>Q</b> queen · <b>R</b> rook · <b>B</b> bishop · <b>N</b> knight. Pawns have no letter.\n\nA move is the piece letter plus the square it goes to. <b>Nf3</b> means a knight moves to f3. <b>e4</b> means a pawn moves to e4.' },
        { t: 'tap', title: 'Read a move', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', body: 'White plays <b>Nf3</b>. Tap the square the knight lands on.', answers: ['f3'] },
        { t: 'move', title: 'Write it out', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', body: 'Now play <b>Nf3</b> on the board.', ok: ['g1f3'], hint: 'The knight on g1 jumps to f3.', win: 'Nf3 it is. It attacks the e5 pawn.' },
        { t: 'text', title: 'Symbols', body: '<b>x</b> means capture: <b>Bxe5</b> is a bishop capturing on e5. A pawn capture lists its file: <b>exd5</b>.\n\n<b>+</b> means check. <b>#</b> means checkmate.\n<b>O-O</b> is kingside castling, <b>O-O-O</b> is queenside.\n<b>=Q</b> means promotion to a queen: <b>e8=Q</b>.' },
        { t: 'text', title: 'Reading a game', body: 'A game is written in numbered pairs. <b>1. e4 e5 2. Nf3 Nc6</b> means: on move 1, White played e4 and Black replied e5; on move 2, White played Nf3 and Black replied Nc6.\n\nIf two identical pieces can reach a square, the notation adds a file or rank: <b>Nbd2</b> is the knight from the b-file.' },
        { t: 'quiz', title: 'Decode it', body: 'What does <b>Qxf7#</b> mean?', options: ['The queen moves to f7', 'The queen captures on f7 and gives check', 'The queen captures on f7 and checkmates'], answer: 2, why: 'Q = queen, x = captures, f7 = the square, # = checkmate. This is the famous Scholar\'s Mate finish.' },
      ],
    },
    {
      id: 'reading', title: 'Reading a position', sub: 'What to look at before you move',
      steps: [
        { t: 'text', title: 'A 10 second scan', body: 'Before every move, scan the board in this order:\n\n<b>1. Checks.</b> Is anyone in check, or can someone give check?\n<b>2. Captures.</b> What can be taken, by either side?\n<b>3. Threats.</b> What is my opponent trying to do next?\n\nThe habit of looking at threats first stops most beginner losses.' },
        { t: 'quiz', title: 'Count the material', fen: 'r5k1/5ppp/8/8/8/8/5PPP/3Q2K1 w - - 0 1', body: 'White has a queen and three pawns. Black has a rook and three pawns. Who is ahead in material?', options: ['White by 4 points', 'Black by 4 points', 'Equal'], answer: 0, why: 'White: 9 + 3 = 12. Black: 5 + 3 = 8. White is up 4 points.' },
        { t: 'tap', title: 'Find the undefended pieces', fen: '4k3/1p6/2n5/8/2B3b1/8/8/3Q2K1 w - - 0 1', body: 'A piece is <b>undefended</b> if nothing can recapture on its square. Tap the two undefended black pieces, not counting the king.', answers: ['b7', 'g4'], all: true },
        { t: 'text', title: 'Keep your eyes on defended pieces', body: 'The knight on c6 is defended by the pawn on b7, so capturing it would cost you a piece. The bishop on g4 and the pawn on b7 have no defenders.\n\nIn every position, ask: <b>what is attacked, and what is protected?</b>' },
      ],
    },
    {
      id: 'gamerules', title: 'The rules of a real game', sub: 'Touch-move, clocks and how games end',
      steps: [
        { t: 'text', title: 'Taking turns', body: 'White moves first, then the players alternate. You cannot skip a move, even when every move is bad.\n\nA game ends when:\n\n• one king is <b>checkmated</b>\n• a player <b>resigns</b>\n• a player runs out of <b>time</b> on the clock\n• the game is <b>drawn</b> (you will study the draws later)' },
        { t: 'text', title: 'Touch-move', body: 'In over-the-board play, <b>if you touch a piece you must move it</b> (if it has a legal move), and if you touch an enemy piece you must capture it if you can.\n\nTo straighten a piece, say <b>"I adjust"</b> (or "j\'adoube") <i>before</i> you touch it.' },
        { t: 'text', title: 'Clocks', body: 'Competitive games use a two-sided clock. After you move, press your side of the clock to stop your time and start your opponent\'s. A time format like <b>10+5</b> means 10 minutes each, plus 5 seconds added after each move.' },
        { t: 'quiz', title: 'A touched piece', body: 'In a real game you touch your bishop and realize it is a mistake. What must you do?', options: ['Move another piece', 'Move that bishop if it has a legal move', 'Take the move back'], answer: 1, why: 'Touch-move: a touched piece has to move. Think first, then touch.' },
      ],
    },
  ],
});

COURSE.modules.push({
  id: 'openings',
  title: 'Openings',
  sub: 'How to start a game, then the classic openings. You play each line with the coach explaining.',
  lessons: [
    {
      id: 'principles', title: 'Opening principles', sub: 'Three rules that beat memorizing',
      practice: { moves: [], label: 'Play a full game' },
      steps: [
        { t: 'text', title: 'Three goals', fen: OPENING_START, hl: ['d4', 'e4', 'd5', 'e5'], body: 'The first moves of a game follow three simple rules:\n\n<b>1. Control the center.</b> Pawns on e4 and d4 give your pieces room.\n<b>2. Develop your pieces.</b> Bring knights and bishops out before moving the same piece twice.\n<b>3. Castle early.</b> Get the king safe and connect your rooks.' },
        { t: 'quiz', title: 'Pick the best move', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', body: 'After 1. e4 e5, which second move best follows the principles?', options: ['Nf3', 'a3', 'Qh5'], answer: 0, why: 'Nf3 develops a piece and attacks e5. a3 does not help the center or development. Qh5 brings the queen out too early, where it can be chased with tempo.' },
        { t: 'text', title: 'Common beginner mistakes', body: '• Moving the queen out early. It becomes a target.\n• Moving the same piece twice while others sleep.\n• Pushing lots of side pawns instead of developing.\n• Forgetting to castle until it is too late.\n• Grabbing pawns while leaving pieces undeveloped.' },
        { t: 'line', title: 'Put it into practice', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'g8f6', 'e1g1'], notes: ['Center pawn forward. Lines open for the queen and bishop.', 'Black copies the plan.', 'A knight comes out with an attack.', 'Black defends and develops.', 'Another piece developed, aimed at f7.', 'Black develops too.', 'Castling: the king is safe, the rook is activated. Three principles in seven moves.'], hint: 'Follow the rules: center, develop, castle.' },
      ],
    },
    {
      id: 'italian', title: 'The Italian Game', sub: '1. e4 e5 2. Nf3 Nc6 3. Bc4',
      practice: { moves: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'f8c5', 'c2c3', 'g8f6', 'd2d3', 'd7d6', 'e1g1', 'e8g8'], label: 'Play the Italian' },
      steps: [
        { t: 'text', title: 'A friendly classic', fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', arrows: [['c4', 'f7', 'r']], body: 'The Italian Game is one of the oldest openings. White develops the bishop to c4 where it aims at f7, Black\'s weakest square in the opening. It is a perfect first opening: the ideas are clear and natural.' },
        { t: 'line', title: 'Play the Italian', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'f8c5', 'c2c3', 'g8f6', 'd2d3', 'd7d6', 'e1g1', 'e8g8'], notes: ['Claim the center and open lines for the queen and bishop.', 'Black mirrors White and fights for the center.', 'Develops a knight and attacks the e5 pawn.', 'Black defends the pawn with a developing move.', 'The bishop eyes f7. This is the Italian Game.', 'Black develops the same way. This is the Giuoco Piano, "the quiet game".', 'Prepares d4 to build a strong center.', 'Black attacks e4 with a developing move.', 'A solid choice. It defends e4 and opens the c1 bishop.', 'Black supports e5 and frees the c8 bishop.', 'White castles: king safe, rook ready.', 'Black castles as well. Both sides are developed, and a rich middlegame begins.'], hint: 'Play the natural developing move.' },
      ],
    },
    {
      id: 'ruy', title: 'The Ruy Lopez', sub: '1. e4 e5 2. Nf3 Nc6 3. Bb5',
      practice: { moves: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1b5', 'a7a6', 'b5a4', 'g8f6', 'e1g1', 'f8e7', 'f1e1', 'b7b5', 'a4b3', 'd7d6', 'c2c3', 'e8g8'], label: 'Play the Ruy Lopez' },
      steps: [
        { t: 'text', title: 'The Spanish Game', fen: 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', arrows: [['b5', 'c6', 'r']], body: 'The Ruy Lopez has been played for 500 years. The bishop pins the pressure on the knight that defends e5. It is a slow, strategic opening that top players still use today.' },
        { t: 'line', title: 'Play the Ruy Lopez', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1b5', 'a7a6', 'b5a4', 'g8f6', 'e1g1', 'f8e7', 'f1e1', 'b7b5', 'a4b3', 'd7d6', 'c2c3', 'e8g8'], notes: ['Center and open lines.', 'Black mirrors.', 'Attacks e5.', 'Defends e5.', 'The Ruy Lopez: the bishop pressures the defender of e5.', 'Black asks the bishop a question.', 'The bishop keeps the pressure by retreating along the diagonal.', 'Black develops and attacks e4.', 'Castling: the e4 pawn is defended tactically.', 'Black prepares to castle.', 'The rook supports e4.', 'Black gains space and kicks the bishop.', 'The bishop retreats to a safe, strong diagonal.', 'Black solidifies the center.', 'c3 prepares d4 to claim the whole center.', 'Black castles. The famous Closed Ruy Lopez.'], hint: 'Pressure the knight that defends e5.' },
      ],
    },
    {
      id: 'sicilian', title: 'The Sicilian Defense', sub: 'You play Black: 1. e4 c5',
      practice: { moves: ['e2e4', 'c7c5', 'g1f3', 'd7d6', 'd2d4', 'c5d4', 'f3d4', 'g8f6', 'b1c3', 'a7a6'], label: 'Play the Sicilian' },
      steps: [
        { t: 'text', title: 'A fighting reply', fen: 'rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', hl: ['c5'], body: 'The Sicilian is the most popular reply to 1. e4. Black does not copy White. Instead the c-pawn fights for the d4 square from the side. The position becomes unbalanced: White usually attacks on the kingside, Black on the queenside.' },
        { t: 'line', title: 'Play the Sicilian as Black', fen: OPENING_START, as: 'b', line: ['e2e4', 'c7c5', 'g1f3', 'd7d6', 'd2d4', 'c5d4', 'f3d4', 'g8f6', 'b1c3', 'a7a6'], notes: ['White takes the center.', 'The Sicilian: Black fights for d4 without copying.', 'White develops and prepares d4.', 'Black opens a path for the c8 bishop and supports e5.', 'White opens the center.', 'Black trades the c-pawn for White\'s center pawn.', 'White recaptures with the knight.', 'Black develops and attacks the e4 pawn.', 'White defends e4 and develops.', 'The Najdorf move: a flexible way to prepare b5 and keep pieces off b5.'], hint: 'As Black, fight for the d4 square.' },
      ],
    },
    {
      id: 'qg', title: 'The Queen\'s Gambit', sub: '1. d4 d5 2. c4',
      practice: { moves: ['d2d4', 'd7d5', 'c2c4', 'e7e6', 'b1c3', 'g8f6', 'c1g5', 'f8e7', 'e2e3', 'e8g8', 'g1f3', 'b8d7'], label: 'Play the Queen\'s Gambit' },
      steps: [
        { t: 'text', title: 'The most respected opening', fen: 'rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq - 0 2', arrows: [['c4', 'd5', 'r']], body: 'White offers the c-pawn to deflect Black\'s center pawn. If Black takes (the Queen\'s Gambit Accepted), White gets a big center and can usually win the pawn back. If Black refuses with ...e6, we get the Queen\'s Gambit Declined, a solid and classic structure.' },
        { t: 'line', title: 'Play the Queen\'s Gambit Declined', fen: OPENING_START, as: 'w', line: ['d2d4', 'd7d5', 'c2c4', 'e7e6', 'b1c3', 'g8f6', 'c1g5', 'f8e7', 'e2e3', 'e8g8', 'g1f3', 'b8d7'], notes: ['The queen pawn controls the center.', 'Black copies.', 'The Queen\'s Gambit: White pressures d5.', 'Black declines and holds the center.', 'Develop and pressure d5 further.', 'Black develops and adds a defender to d5.', 'The bishop pins the knight to the queen, adding pressure.', 'Black breaks the pin.', 'Solid center, opens the bishop on f1.', 'Black castles.', 'Development completed, kingside knight out.', 'Black finishes development in a very solid way.'], hint: 'White fights for the center with the c-pawn.' },
      ],
    },
    {
      id: 'london', title: 'The London System', sub: 'An easy setup for White',
      practice: { moves: ['d2d4', 'd7d5', 'c1f4', 'g8f6', 'e2e3', 'e7e6', 'g1f3', 'c7c5', 'c2c3', 'b8c6', 'b1d2', 'f8d6', 'f4g3', 'e8g8'], label: 'Play the London' },
      steps: [
        { t: 'text', title: 'Same setup every time', fen: 'rnbqkb1r/ppp1pppp/5n2/3p4/3P1B2/8/PPP1PPPP/RN1QKBNR w KQkq - 2 3', body: 'The London System is easy to learn because White plays the same moves against almost everything: d4, Bf4, e3, Nf3, c3, Nbd2. The bishop comes out <b>before</b> e3 closes it in, which is the whole point.' },
        { t: 'line', title: 'Play the London', fen: OPENING_START, as: 'w', line: ['d2d4', 'd7d5', 'c1f4', 'g8f6', 'e2e3', 'e7e6', 'g1f3', 'c7c5', 'c2c3', 'b8c6', 'b1d2', 'f8d6', 'f4g3', 'e8g8'], notes: ['Take the center.', 'Black copies.', 'The signature move: the bishop goes outside the pawn chain.', 'Black develops.', 'Opens the f1 bishop and supports the center.', 'Black solidifies.', 'Develops the kingside knight.', 'Black strikes at your center.', 'Reinforces d4.', 'Black develops.', 'A natural knight development.', 'Black attacks your bishop.', 'The bishop retreats but keeps the diagonal.', 'Both sides castle soon. A solid, comfortable position.'], hint: 'Bishop outside the pawn chain.' },
      ],
    },
    {
      id: 'caro', title: 'The Caro-Kann Defense', sub: 'You play Black: 1. e4 c6',
      practice: { moves: ['e2e4', 'c7c6', 'd2d4', 'd7d5', 'b1c3', 'd5e4', 'c3e4', 'c8f5', 'e4g3', 'f5g6', 'h2h4', 'h7h6', 'g1f3', 'b8d7'], label: 'Play the Caro-Kann' },
      steps: [

        { t: 'line', title: 'Play the Caro-Kann as Black', fen: OPENING_START, as: 'b', line: ['e2e4', 'c7c6', 'd2d4', 'd7d5', 'b1c3', 'd5e4', 'c3e4', 'c8f5', 'e4g3', 'f5g6', 'h2h4', 'h7h6', 'g1f3', 'b8d7'], notes: ['White takes the center.', 'The Caro-Kann: prepares d5.', 'White builds a big center.', 'Black challenges the center.', 'White defends the e4 pawn.', 'Black trades pawns.', 'White recaptures.', 'The key idea: the bishop gets out <b>before</b> ...e6 closes it in.', 'The knight attacks the bishop.', 'The bishop retreats and keeps its diagonal.', 'White gains space and threatens to trap the bishop.', 'Black gives the bishop a retreat square.', 'White develops.', 'Black develops. A safe and solid position.'], hint: 'Prepare d5 with a modest pawn move.' },
      ],
    },
  ],
});

COURSE.modules.push({
  id: 'gambits',
  title: 'Gambits and Traps',
  sub: 'Sacrifice a pawn for the initiative, and learn the traps that catch beginners.',
  lessons: [
    {
      id: 'whatgambit', title: 'What is a gambit?', sub: 'Giving a pawn to gain time',
      steps: [
        { t: 'text', title: 'A pawn for the initiative', body: 'A <b>gambit</b> is an opening where one side offers a pawn, hoping to gain faster development, open lines or a lead in the attack.\n\nThe idea: a pawn is worth 1 point, but three tempi (free moves) of development can be worth far more, especially against a player who is careless with their king.' },
        { t: 'quiz', title: 'Why offer a pawn?', body: 'What is the main goal of a gambit?', options: ['To lose material on purpose for no reason', 'To get a lead in development and an initiative', 'To trade queens early'], answer: 1, why: 'The pawn is given for time, space and open lines. If the opponent takes the pawn and then falls behind in development, the gambit succeeds.' },
        { t: 'text', title: 'How to play against gambits', body: 'If someone offers you a gambit pawn, you have three options: accept it and try to return the pawn at a good moment, decline it, or counter-attack. Whichever you choose, <b>keep developing and castle</b>. Greedy play is how gambits win.' },
      ],
    },
    {
      id: 'kingsgambit', title: 'The King\'s Gambit', sub: '1. e4 e5 2. f4',
      practice: { moves: ['e2e4', 'e7e5', 'f2f4', 'e5f4', 'g1f3', 'g7g5', 'h2h4', 'g5g4', 'f3e5'], label: 'Play the King\'s Gambit' },
      steps: [
        { t: 'line', title: 'Play the King\'s Gambit', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'f2f4', 'e5f4', 'g1f3', 'g7g5', 'h2h4', 'g5g4', 'f3e5'], notes: ['Center pawn first.', 'Black mirrors.', 'The King\'s Gambit: White offers the f-pawn to open the f-file and deflect the e5 pawn.', 'Black accepts the pawn.', 'White develops and prevents ...Qh4+.', 'Black tries to hold the extra pawn by pushing.', 'White attacks the advanced pawn.', 'Black keeps pushing.', 'The knight lands on e5 with a strong center. Wild, open play: this is why the King\'s Gambit is loved.'], hint: 'White offers the f-pawn.' },
      ],
    },
    {
      id: 'evans', title: 'The Evans Gambit', sub: '1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4',
      practice: { moves: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'f8c5', 'b2b4', 'c5b4', 'c2c3', 'b4a5', 'd2d4', 'e5d4', 'e1g1'], label: 'Play the Evans Gambit' },
      steps: [
        { t: 'line', title: 'Play the Evans Gambit', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'g1f3', 'b8c6', 'f1c4', 'f8c5', 'b2b4', 'c5b4', 'c2c3', 'b4a5', 'd2d4', 'e5d4', 'e1g1'], notes: ['Center.', 'Mirror.', 'Develops, attacks e5.', 'Defends.', 'Bishop aims at f7.', 'Black copies.', 'The Evans Gambit: the b-pawn deflects the bishop and prepares c3 and d4.', 'Black accepts the pawn.', 'Gains time by attacking the bishop and prepares d4.', 'The bishop retreats but is far from the king.', 'White grabs the center, threatening e5.', 'Black takes the center pawn.', 'White castles, planning to regain the pawn with a strong attack. The initiative is worth the pawn.'], hint: 'The pawn on b4 is the gambit.' },
      ],
    },
    {
      id: 'morra', title: 'The Smith-Morra Gambit', sub: 'Against the Sicilian: 1. e4 c5 2. d4',
      practice: { moves: ['e2e4', 'c7c5', 'd2d4', 'c5d4', 'c2c3', 'd4c3', 'b1c3', 'b8c6', 'g1f3', 'd7d6', 'f1c4'], label: 'Play the Smith-Morra' },
      steps: [
        { t: 'line', title: 'Play the Smith-Morra', fen: OPENING_START, as: 'w', line: ['e2e4', 'c7c5', 'd2d4', 'c5d4', 'c2c3', 'd4c3', 'b1c3', 'b8c6', 'g1f3', 'd7d6', 'f1c4'], notes: ['Center.', 'The Sicilian.', 'White offers the d-pawn to open the center.', 'Black takes.', 'The gambit: offering a second pawn.', 'Black takes again.', 'White recaptures and develops with a threat.', 'Black develops.', 'White develops, adding pressure.', 'Black protects the center.', 'The bishop aims at f7. White has two extra developed pieces, an open center and great attacking chances for the pawn.'], hint: 'White offers a pawn on c3 to get quick development.' },
      ],
    },
    {
      id: 'traps', title: 'Traps every player should know', sub: 'Scholar\'s mate, the Legal trap, and Fool\'s mate',
      steps: [
        { t: 'line', title: 'Scholar\'s mate: the 4-move attack', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'd1h5', 'b8c6', 'f1c4', 'g8f6', 'h5f7'], notes: ['Center.', 'Black mirrors.', 'The queen attacks e5 and eyes f7.', 'Black defends e5 but forgets f7.', 'The bishop and queen both aim at f7.', 'Black attacks the queen, but forgets about f7.', 'Qxf7#. Checkmate! The queen is protected by the bishop, and the king has no escape.'], hint: 'Queen and bishop both aim at f7.' },
        { t: 'line', title: 'Defending against Scholar\'s mate', fen: OPENING_START, as: 'b', line: ['e2e4', 'e7e5', 'd1h5', 'b8c6', 'f1c4', 'g7g6', 'h5f3', 'g8f6'], notes: ['White takes the center.', 'You mirror.', 'The queen comes out early.', 'Defends the e5 pawn.', 'Now f7 is attacked twice.', 'Attack the queen, so it has to move. g6 also blocks the diagonal.', 'The queen retreats but still eyes f7.', 'Develop with tempo and defend f7. Now you are better developed than White, who wasted time with the queen.'], hint: 'Chase the queen with a pawn.' },
        { t: 'line', title: 'The Legal trap', fen: OPENING_START, as: 'w', line: ['e2e4', 'e7e5', 'g1f3', 'd7d6', 'f1c4', 'c8g4', 'b1c3', 'g7g6', 'f3e5', 'g4d1', 'c4f7', 'e8e7', 'c3d5'], notes: ['Center.', 'Mirror.', 'Develops, attacks e5.', 'Defends e5 passively.', 'Develops.', 'Black pins the knight to the queen, a natural move.', 'Develops a piece and ignores the pin!', 'Black thinks it can win the knight.', 'Surprise! White sacrifices the queen.', 'Black grabs the queen.', 'Check! The bishop attacks the king.', 'The king has only one move.', 'Nd5#. Checkmate with two minor pieces. White gave a queen but won the game.'], hint: 'Sacrifice the queen on purpose.' },
        { t: 'line', title: 'Fool\'s mate: the fastest checkmate', fen: OPENING_START, as: 'b', line: ['f2f3', 'e7e5', 'g2g4', 'd8h4'], notes: ['White moves a pawn that weakens the king.', 'Black opens the diagonal for the queen.', 'White pushes another pawn, opening the diagonal fully.', 'Qh4#. Checkmate on move 2. Never weaken the pawns in front of your king like this.'], hint: 'Open the diagonal to the king, then strike.' },
      ],
    },
  ],
});

COURSE.modules.push({
  id: 'tactics',
  title: 'Tactics',
  sub: 'Forks, pins, skewers and discovered attacks. The tricks that win material.',
  lessons: [
    {
      id: 'forks', title: 'Forks', sub: 'One piece, two targets',
      practice: { fen: 'r3k3/8/8/1N6/8/8/8/4K3 w - - 0 1', label: 'Try the fork in play' },
      steps: [
        { t: 'text', title: 'Attacking two at once', fen: 'r3k3/8/2N5/8/8/8/8/4K3 w - - 0 1', arrows: [['c6', 'e7', 'r'], ['c6', 'a7', 'r']], body: 'A <b>fork</b> is a single move that attacks two or more pieces at the same time. The opponent can usually save only one.\n\nKnights are fork specialists because their jump is hard to see coming, but every piece, including pawns, can fork.' },
        { t: 'move', title: 'Fork the king and rook', fen: 'r3k3/8/8/1N6/8/8/8/4K3 w - - 0 1', ok: ['b5c7'], hint: 'Find the square that attacks both the king on e8 and the rook on a8.', win: 'Nc7+ forks the king and rook. The king must move, then you take the rook.' },
        { t: 'move', title: 'A pawn fork', fen: 'k7/8/3n1n2/8/4P3/8/8/K7 w - - 0 1', ok: ['e4e5'], hint: 'Push the pawn so it attacks both knights.', win: 'The pawn on e5 attacks both knights. Even the humble pawn forks.' },
        { t: 'text', title: 'Look for forks', body: 'Before each move, ask: <b>Are two enemy pieces on squares that one of my pieces could attack at once?</b> And in defense: <b>Could my opponent fork me next move?</b>' },
      ],
    },
    {
      id: 'pins', title: 'Pins', sub: 'A piece that cannot move',
      practice: { fen: '4k3/4b3/8/8/8/8/8/R5K1 w - - 0 1', label: 'Pin in play' },
      steps: [
        { t: 'text', title: 'Stuck in place', fen: '4k3/4b3/8/8/8/8/8/R5K1 w - - 0 1', arrows: [['a1', 'e1']], body: 'A <b>pin</b> is when a piece cannot move because it would expose a more valuable piece behind it.\n\nIf the piece behind is the <b>king</b>, it is an <b>absolute pin</b>: the pinned piece simply cannot legally move. If the piece behind is something else, like a queen, it is a <b>relative pin</b>: the piece may move, but it would lose the more valuable piece.' },
        { t: 'move', title: 'Pin the bishop', fen: '4k3/4b3/8/8/8/8/8/R5K1 w - - 0 1', ok: ['a1e1'], hint: 'Put the rook on the e-file.', win: 'The bishop on e7 is pinned to the king and cannot move. Next you can attack it with another piece.' },
        { t: 'quiz', title: 'Relative pin', body: 'A black knight is pinned to the black queen by your bishop. Can the knight legally move?', options: ['No, never', 'Yes, but it loses the queen'], answer: 1, why: 'Only a pin against the king makes a piece immovable. Against a queen, the pinned piece can legally move but then you win the queen.' },
      ],
    },
    {
      id: 'skewers', title: 'Skewers', sub: 'The pin in reverse',
      practice: { fen: '4r3/8/8/4k3/8/8/8/R5K1 w - - 0 1', label: 'Skewer in play' },
      steps: [
        { t: 'text', title: 'A pin backwards', fen: '4r3/8/8/4k3/8/8/8/R5K1 w - - 0 1', body: 'A <b>skewer</b> attacks a valuable piece that must move away, exposing a less valuable piece behind it to capture. It is the opposite of a pin: the <b>bigger</b> piece is in front.' },
        { t: 'line', title: 'Skewer the king and rook', fen: '4r3/8/8/4k3/8/8/8/R5K1 w - - 0 1', as: 'w', line: ['a1e1', 'e5d5', 'e1e8'], notes: ['Check! The king is in front, the rook behind it on the same file.', 'The king must step off the e-file.', 'The rook on e8 is now unprotected, and your rook captures it. Skewer complete.'], hint: 'Check the king along the file where the rook hides behind it.' },
      ],
    },
    {
      id: 'discovered', title: 'Discovered attacks', sub: 'Moving one piece to unleash another',
      practice: { fen: 'r3k3/8/8/8/4B3/8/8/4R1K1 w - - 0 1', label: 'Discovery in play' },
      steps: [
        { t: 'text', title: 'Two threats at once', fen: 'r3k3/8/8/8/4B3/8/8/4R1K1 w - - 0 1', arrows: [['e1', 'e8', 'r'], ['e4', 'a8']], body: 'A <b>discovered attack</b> happens when you move one piece out of the way, <i>revealing</i> an attack from another piece behind it.\n\nIt is especially powerful when the revealed attack is a <b>check</b>, because the opponent must answer the check and cannot deal with what the moved piece does.' },
        { t: 'move', title: 'Discover the check', fen: 'r3k3/8/8/8/4B3/8/8/4R1K1 w - - 0 1', ok: ['e4a8'], hint: 'Move the bishop with a capture. The rook behind it gives check.', win: 'Bxa8+ captures a rook, and the rook on e1 gives check at the same time. Black has to answer the check, so you keep the rook.' },
      ],
    },
    {
